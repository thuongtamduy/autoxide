# Autoxide + PostgreSQL bằng Docker Compose. Xem docs/DEPLOY.md.
#
# Đặt secret trong file `.env` cạnh file này (không commit), ví dụ:
#   POSTGRES_PASSWORD=<openssl rand -hex 24>
#   AUTOXIDE_AUTH_TOKEN_SECRET=<openssl rand -base64 48>
#   AUTOXIDE_SECRET_KEY=<openssl rand -base64 48>
# rồi chạy:  docker compose up -d --build

x-autoxide: &autoxide
  build: .
  # Dùng image đã phát hành thay vì tự build: đặt AUTOXIDE_IMAGE (vd
  # ghcr.io/<owner>/autoxide:0.1) rồi chạy `docker compose up -d --no-build`.
  image: ${AUTOXIDE_IMAGE:-autoxide:local}
  environment:
    DATABASE_URL: postgres://autoxide:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/autoxide
    AUTOXIDE_AUTH_TOKEN_SECRET: ${AUTOXIDE_AUTH_TOKEN_SECRET:?set AUTOXIDE_AUTH_TOKEN_SECRET in .env}
    # Bắt buộc ở bản chạy thật: thiếu thì khoá gốc nằm trong database, bản sao lưu database mở được
    # mọi secret đã mã hoá. (Bản chạy thử `compose.quickstart.yml` không bắt buộc.)
    AUTOXIDE_SECRET_KEY: ${AUTOXIDE_SECRET_KEY:?set AUTOXIDE_SECRET_KEY in .env}
    # Module nào chạy (docs/MODULES.md): mặc định module chính thức; module thử nghiệm phải nêu tên,
    # vd AUTOXIDE_MODULES=official,newsletter trong .env. Bản cài từ 0.17 trở về trước: xem mục nâng cấp.
    AUTOXIDE_MODULES: ${AUTOXIDE_MODULES:-official}
    AUTOXIDE_MAIL_SMTP_URL: ${AUTOXIDE_MAIL_SMTP_URL:-}
    AUTOXIDE_MAIL_FROM: ${AUTOXIDE_MAIL_FROM:-Autoxide <noreply@localhost>}
  volumes:
    - data:/var/lib/autoxide/data

services:
  postgres:
    # Bản mới nhất được hỗ trợ, để bản cài mới được vá lâu nhất (PostgreSQL 18: tới 11/2030).
    # Bản tối thiểu (16) vẫn được gate và CI test.
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: autoxide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autoxide
    volumes:
      # Từ bản 18, image đặt dữ liệu ở /var/lib/postgresql/<bản>/docker: gắn volume vào thư
      # mục cha để lần nâng bản chính sau (pg_upgrade) thấy được cả dữ liệu cũ lẫn mới.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoxide -d autoxide"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Áp dụng migration (database chính rồi mọi database riêng của khách) rồi thoát; máy chủ chỉ
  # khởi động khi bước này xong. Một khách hỏng thì các khách khác vẫn được nâng, bước báo lỗi.
  migrate:
    <<: *autoxide
    command: ["migrate", "up", "--all"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *autoxide
    command: ["serve"]
    ports:
      # Chỉ mở trên máy này; đặt reverse proxy (TLS) phía trước khi ra internet.
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Docker mặc định chỉ chờ 10 giây rồi giết tiến trình; cho đủ khoảng rút
    # (AUTOXIDE_HTTP_DRAIN_SECONDS) + AUTOXIDE_HTTP_SHUTDOWN_SECONDS (mặc định 0 + 30).
    stop_grace_period: 40s

volumes:
  postgres:
  data:
