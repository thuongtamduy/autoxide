# Cấu hình gitleaks (quét secret trong CI): bộ luật mặc định, cộng một ngoại lệ hẹp.
title = "Autoxide"

[extend]
useDefault = true

[[allowlists]]
description = "Chủ thể event dạng `<module>.<loại>:<UUID>` trong ví dụ là ID, không phải secret"
regexTarget = "match"
regexes = [
  '''[a-z_]+\.[a-z_]+:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]
