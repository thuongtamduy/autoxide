# Cấu hình gitleaks (quét secret trong gate — `./gate.sh`, D-108): bộ luật mặc định, cộng vài ngoại lệ hẹp.
title = "Autoxide"

[extend]
useDefault = true

[[allowlists]]
description = "Chủ thể event dạng `<module>.<loại>:<UUID>` trong ví dụ là ID, không phải secret"
regexTarget = "match"
regexes = [
  '''[a-z_]+\.[a-z_]+:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]

[[allowlists]]
description = "Khoá ví dụ CÔNG KHAI trong bộ test chính thức của Standard Webhooks (modules/webhooks, test khớp chữ ký) — không phải secret của ai"
regexTarget = "match"
regexes = [
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''',
]
