# Bảng chỉ số của một bản phát hành (71-G9; mô tả và ngưỡng ở docs/RELEASING.md, "Chỉ số của mỗi bản phát hành"): đo thời
# gian từ tải về tới request đầu tiên trên máy sạch rồi gộp với kết quả đã có của CI (nâng cấp, p95, eval agent), ghi bảng
# vào trang tóm tắt và ghi chú bản phát hành. Workflow dùng lại (reusable): `release.yml` gọi nó như một job SAU khi đã
# đăng bản phát hành (không dùng trigger `workflow_run`: zizmor xếp nó là không an toàn); chạy tay cho một tag đã có bằng
# `workflow_dispatch`. Chỉ số ĐÃ ĐO mà không đạt thì bảng ghi KHÔNG ĐẠT và bước cuối báo cảnh báo (không làm đỏ cả workflow
# Release: bản đã đăng rồi, đỏ cũng không rút lại được); bản 1.0 chỉ phát hành khi cả năm chỉ số đạt, kiểm tay lúc chốt.
name: Release metrics

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  metrics:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # chỉ để thêm bảng vào ghi chú của bản phát hành (bước cuối)
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Version and commit of the release
        id: release
        run: |
          tag="v${INPUT_TAG#v}"
          case "$tag" in v[0-9]*) ;; *) echo "::error::not a release tag: $tag"; exit 1 ;; esac
          sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Time from download to the first request
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/release-time-to-first-request.sh "$VERSION" "$GH_REPO" | tee first-request.json
      # Bộ eval agent của G4: file kết quả `docs/quality/agent-eval.json` (định dạng agent-eval.schema.json) nếu bản này có.
      - name: Table
        id: table
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          eval_file=""
          [ -f docs/quality/agent-eval.json ] && eval_file="--agent-eval docs/quality/agent-eval.json"
          set +e
          # shellcheck disable=SC2086
          scripts/release-metrics.py --version "$VERSION" --sha "$SHA" --first-request first-request.json $eval_file | tee metrics.md
          status="${PIPESTATUS[0]}"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # Thêm bảng vào ghi chú bản phát hành (một lần: thay phần cũ nếu chạy lại).
      - name: Add the table to the release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          python3 - <<'PY'
          import re
          notes = open("notes.md").read()
          notes = re.sub(r"\n*## Chỉ số bản .*\Z", "", notes, flags=re.S).rstrip()
          open("notes.md", "w").write(notes + "\n\n" + open("metrics.md").read())
          PY
          gh release edit "$TAG" --notes-file notes.md
      - name: Warn when a measured metric misses its limit
        if: ${{ steps.table.outputs.status != '0' }}
        run: echo "::warning::at least one measured release metric misses its 1.0 limit; see the table in the job summary and the release notes"
