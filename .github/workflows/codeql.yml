# CodeQL: phân tích tĩnh mã Rust, TypeScript của SDK và chính các workflow (D-20261126-road-to-1-0, G8). Kết quả vào
# tab Security → Code scanning. Chạy khi push main, trên pull request, và mỗi tuần (lỗ hổng mới trong bộ truy vấn).
# Chỉ chạy khi repo công khai (D-197): repo riêng tư cần GitHub Advanced Security có phí.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

# Mỗi job tự xin quyền; mức workflow không cấp gì.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # đẩy kết quả lên Code scanning
    strategy:
      fail-fast: false
      matrix:
        # `rust` và `actions` không cần build (build-mode none); JS/TS cũng vậy.
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Bỏ qua code chỉ dùng cho test (D-20261127-codeql-skip-tests).
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
