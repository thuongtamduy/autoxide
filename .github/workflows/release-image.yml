# Đăng image Docker cho một tag phát hành ĐÃ CÓ, không phát hành lại (D-20261120-upgrade-image).
#
# Dùng khi workflow Release của tag không đăng được image: tag đẩy lúc repo còn riêng tư (Release bị
# bỏ qua, D-197), hay chạy lại Release trên tag cũ thì gate đỏ vì thứ mới xuất hiện sau ngày phát hành
# (vd `cargo deny` gặp advisory mới). Job `upgrade` của CI kéo `ghcr.io/<owner>/<repo>:X.Y.Z` của bản
# trước (`cargo xtask upgrade-test`); thiếu image thì nó build lại bản cũ từ tag (~10 phút mỗi lần).
#
# Chạy tay: Actions → "Release image (existing tag)" → Run workflow trên nhánh `main`, nhập tag
# (vd `v0.14.0`). Workflow lấy file từ `main` và build mã nguồn của tag, nên sửa ở đây dùng được cho
# tag cũ. Không chạy gate (tag đã qua gate lúc phát hành), không tạo bản phát hành GitHub, không đổi
# tag. Tên và thẻ image giống hệt workflow Release: `X.Y.Z` và `X.Y`, cho `linux/amd64` và `linux/arm64`.
name: Release image (existing tag)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that already exists, e.g. v0.14.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - id: version
        name: The tag is a release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must look like vX.Y.Z, got '$TAG'" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Tag matches the version in Cargo.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "$version" = "$VERSION" ] || { echo "Cargo.toml at the tag says $version" >&2; exit 1; }

  # Như job `image` của release.yml: mỗi kiến trúc build trên máy cùng kiến trúc, đẩy theo digest.
  image:
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      # Dockerfile lấy từ commit của workflow này (main), không từ tag: tag cũ có Dockerfile cũ không tách lớp
      # thư viện (cargo-chef), nên build lại từ đầu mỗi lần (D-20261120-docker-chef). Mã nguồn vẫn là của tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-files
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .ci-files/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [tag, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cùng hai thẻ như release.yml (`{{version}}`, `{{major}}.{{minor}}`); `X.Y.Z` là thẻ mà
      # `cargo xtask upgrade-test` kéo.
      - name: Create the multi-platform image with its tags
        working-directory: digests
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          MINOR: ${{ needs.tag.outputs.minor }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" \
            $(printf "$IMAGE@sha256:%s " *)
      - id: index
        name: Digest of the multi-platform image
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
