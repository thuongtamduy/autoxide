# Thử phá có chủ đích (D-20261123-property-fuzzing): mỗi đêm chạy lại mọi unit test của workspace với số ca
# property test lớn hơn gate nhiều lần (gate: 256 ca mỗi test). Không chặn PR; đỏ thì ca hỏng nằm trong log
# (proptest in đầu vào đã thu gọn) — thêm nó vào `proptest-regressions/` cạnh file nguồn rồi sửa. Chỉ chạy khi repo
# công khai (D-197).
name: Property tests (long)

on:
  schedule:
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property test
        default: "20000"

permissions:
  contents: read

jobs:
  long:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROPTEST_CASES: ${{ inputs.cases || '20000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # Chỉ unit test (`--lib`): property test nằm cạnh hàm được thử; test tích hợp đã chạy trong gate.
      - run: cargo test --workspace --lib --locked --no-fail-fast

  # Đỏ thì mở (hay cập nhật) một issue, xanh lại thì đóng (D-20261125-cloud-dev-friction): lần chạy đêm đỏ không ai
  # thấy nếu không mở trang Actions. Quyền `issues: write` chỉ ở job này.
  report:
    if: ${{ always() && github.event_name == 'schedule' && !github.event.repository.private }}
    needs: long
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/nightly-issue.sh "$TITLE" "$RESULT" "$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Nightly property tests are failing"
          RESULT: ${{ needs.long.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
