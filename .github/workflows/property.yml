# Thử phá có chủ đích (D-20261123-property-fuzzing): mỗi đêm chạy lại mọi unit test của workspace với số ca
# property test lớn hơn gate nhiều lần (gate: 256 ca mỗi test). Không chặn PR; đỏ thì ca hỏng nằm trong log
# (proptest in đầu vào đã thu gọn) — thêm nó vào `proptest-regressions/` cạnh file nguồn rồi sửa. Chỉ chạy khi repo
# công khai (D-197).
name: Property tests (long)

on:
  schedule:
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property test
        default: "20000"

permissions:
  contents: read

jobs:
  long:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROPTEST_CASES: ${{ inputs.cases || '20000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # Chỉ unit test (`--lib`): property test nằm cạnh hàm được thử; test tích hợp đã chạy trong gate.
      - run: cargo test --workspace --lib --locked
