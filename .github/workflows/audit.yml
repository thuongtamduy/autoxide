# Kiểm lỗ hổng thư viện mỗi ngày, kể cả khi không ai commit: lỗ hổng mới được công bố
# cho thư viện đang dùng thì job đỏ (D-078). Chỉ chạy khi repo công khai (D-197).
name: Security audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny@0.22.0
      # Chỉ phần lỗ hổng: license và nguồn không đổi khi không có commit.
      - run: cargo deny check advisories

  # Đỏ thì mở (hay cập nhật) một issue, xanh lại thì đóng (D-20261125-cloud-dev-friction): lần chạy đêm đỏ không ai
  # thấy nếu không mở trang Actions. Quyền `issues: write` chỉ ở job này.
  report:
    if: ${{ always() && github.event_name == 'schedule' && !github.event.repository.private }}
    needs: advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/nightly-issue.sh "$TITLE" "$RESULT" "$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Nightly security audit is failing"
          RESULT: ${{ needs.advisories.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
