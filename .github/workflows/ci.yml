# CI của Autoxide: gate đầy đủ (giống `./gate.sh` trên máy, chia ba phần chạy song song) trên
# PostgreSQL thấp nhất được hỗ trợ và mới nhất, cộng quét secret trong toàn bộ lịch sử git (D-074). `./gate.sh` trên
# máy vẫn là định nghĩa "xong" (D-173); CI là lưới thứ hai (D-175).
#
# Mọi job chỉ chạy khi repo công khai (D-197): repo riêng tư thì GitHub tính phí runner, nên
# job bị bỏ qua trước khi xin runner — không tốn phút nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay (Actions → Run workflow), vd sau khi đổi cài đặt của repo.
  workflow_dispatch:

permissions:
  contents: read

# Pull request: lần push mới huỷ lần chạy cũ của cùng nhánh. Main thì không huỷ: lần chạy bị huỷ
# không lưu được cache (bước Post của rust-cache không chạy), và trước đây mỗi lần merge huỷ lần
# chạy main trước nên main không bao giờ có cache, mọi PR build từ đầu (D-20261119-ci-faster).
# Không huỷ thì lần chạy main mới chờ lần đang chạy xong; GitHub chỉ giữ một lần chờ (lần mới nhất).
# PR ghép lô của phiên điều phối (tiêu đề bắt đầu bằng "Lô:", D-20261119-merge-batches): đã kiểm trên máy
# và merge ngay, lần chạy trên main mới là lưới kiểm — các job nặng bỏ qua để không chiếm máy của lần
# chạy main; job `gate` vẫn báo xong. PR của phiên làm việc chạy đủ như cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gate tách thành nhiều phần chạy song song, mỗi phần một máy (`./gate.sh --only lint`, `--only build`
# rồi `--only sqlite|postgres --archive … --shard k/n`; cộng lại đúng bằng gate một máy), định nghĩa ở
# gate.yml (dùng chung với release.yml, D-20261120-release-gate-sharded); job `gate (PostgreSQL …)` gộp
# kết quả dưới tên check cũ (D-20261119-ci-faster, D-20261120-ci-nextest-archive). Cache: xem gate.yml.
jobs:
  # Gate chia nhiều máy, định nghĩa ở gate.yml (dùng chung với release.yml). Tên job gọi `gate` nên các
  # check vẫn tên "gate / lint", "gate / build tests", "gate / sqlite 1/4"… như khi còn nằm ở đây.
  parts:
    name: gate
    if: ${{ !github.event.repository.private && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Lô:')) }}
    uses: ./.github/workflows/gate.yml
    with:
      # Pull request chỉ chạy PostgreSQL thấp nhất (có kết quả sớm); push main và chạy tay chạy cả hai.
      postgres-18: ${{ github.event_name != 'pull_request' }}

  # Tên check cũ, có thể là check bắt buộc của branch protection: chỉ xanh khi mọi phần của gate
  # xanh. `always()`: phần nào đỏ thì job này vẫn chạy và báo đỏ, không bị bỏ qua (check bị bỏ qua
  # được tính là đạt).
  gate:
    name: gate (PostgreSQL ${{ github.event_name == 'pull_request' && '16' || '16, 18' }})
    if: ${{ always() && !github.event.repository.private }}
    needs: parts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          GATE: ${{ needs.parts.result }}
          BATCH: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Lô:') }}
        run: |
          echo "gate: $GATE"
          if [ "$BATCH" = true ]; then
            echo "Batch PR (title starts with 'Lô:'): checked on the coordinator's machine and merged at once; main's run is the check."
            exit 0
          fi
          [ "$GATE" = success ]

  sdk:
    name: TypeScript SDK and guide examples (tsc)
    if: ${{ !github.event.repository.private && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Lô:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      # Ví dụ TypeScript của docs/guides kiểm kiểu cùng SDK (đặc tả 31 A5).
      - run: cargo xtask sdk --extract-examples sdk/typescript/examples/guides
      - name: tsc --noEmit
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit

  sdk-mobile:
    # Bước 69 P1 (D-20261119-step69-sdk): sinh và biên dịch SDK Swift, Kotlin, Dart từ docs/openapi.json
    # bằng công cụ ghim phiên bản. Gate không cần Swift hay JDK — nó chỉ kiểm cấu hình (`xtask sdk --check`).
    # Chỉ làm việc khi PR đổi hợp đồng API hay SDK; kiểm đường dẫn trong một bước (không dùng `paths:` ở
    # trigger) để job vẫn báo xong khi nó là check bắt buộc.
    name: Mobile SDK (${{ matrix.sdk }})
    if: ${{ !github.event.repository.private && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Lô:')) }}
    runs-on: ubuntu-24.04
    # Swift: ở PR chỉ kiểm manifest và phụ thuộc (nhẹ); biên dịch đầy đủ (dựng cả swift-syntax của plugin
    # sinh mã) chỉ khi push vào main, có cache — không chặn hàng đợi merge.
    timeout-minutes: ${{ (matrix.sdk == 'swift' && github.event_name != 'pull_request') && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [swift, kotlin, dart]
    steps:
      - uses: actions/checkout@v7
      - name: changed
        id: changed
        run: |
          # PR: so với nhánh đích. Push vào main: so với commit trước lần push (`before`) — phần lớn lần
          # merge không đổi hợp đồng API nên khỏi build SDK (Swift trên Linux ~15 phút). Không lấy được
          # commit trước (push đầu, force push) hay chạy tay thì build cho chắc.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --quiet --depth=1 origin "$base"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only FETCH_HEAD HEAD \
            | grep -qE '^(docs/openapi\.json|sdk/|Package\.swift|xtask/src/sdk_mobile\.rs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Neither the API contract nor the SDKs changed: nothing to build."
          fi
      # Swift: plugin swift-openapi-generator sinh mã lúc build từ sdk/swift/Sources/Autoxide/openapi.json.
      - name: swift package resolve (pull request)
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'swift' && github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo swift:6.4.2-noble \
            sh -c 'swift package dump-package > /dev/null && swift package resolve'
          jq empty sdk/swift/Sources/Autoxide/openapi.json
          cmp docs/openapi.json sdk/swift/Sources/Autoxide/openapi.json
      - uses: actions/cache@v6
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'swift' && github.event_name != 'pull_request'
        with:
          path: .build
          key: swift-${{ hashFiles('Package.swift') }}-${{ hashFiles('sdk/swift/Sources/Autoxide/openapi.json') }}
          restore-keys: swift-${{ hashFiles('Package.swift') }}-
      - name: swift build
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'swift' && github.event_name != 'pull_request'
        run: docker run --rm -v "$PWD:/repo" -w /repo swift:6.4.2-noble swift build --product Autoxide
      # Docker chạy bằng root nên `.build` thuộc root: trả quyền cho người dùng của runner để bước lưu cache
      # (sau job) đóng gói được, lần sau build tiếp từ cache thay vì từ đầu.
      - name: swift cache ownership
        if: always() && steps.changed.outputs.run == 'true' && matrix.sdk == 'swift' && github.event_name != 'pull_request'
        run: sudo chown -R "$(id -u):$(id -g)" .build || true
      - uses: actions/setup-java@v6
        if: steps.changed.outputs.run == 'true' && matrix.sdk != 'swift'
        with:
          distribution: temurin
          java-version: "21"
      # Phiên bản openapi-generator và tham số của từng SDK ở sdk/openapitools.json; tải jar thẳng từ
      # Maven Central (bản bọc npm dùng API tìm kiếm của Maven, hay bị giới hạn lượt gọi).
      - name: generate
        if: steps.changed.outputs.run == 'true' && matrix.sdk != 'swift'
        run: |
          config=sdk/openapitools.json
          version=$(jq -r '."generator-cli".version' "$config")
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/openapi-generator.jar" \
            "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/$version/openapi-generator-cli-$version.jar"
          generator=".\"generator-cli\".generators.${{ matrix.sdk }}"
          java -jar "$RUNNER_TEMP/openapi-generator.jar" generate \
            -g "$(jq -r "$generator.generatorName" "$config")" \
            $(jq -r "$generator.library // empty | \"--library=\" + ." "$config") \
            -i docs/openapi.json \
            -o "sdk/${{ matrix.sdk }}/generated" \
            --additional-properties="$(jq -r "$generator.additionalProperties | to_entries | map(\"\(.key)=\(.value)\") | join(\",\")" "$config")"
      # Tải và cache bản Gradle mà wrapper do generator sinh cần (tải thẳng hay quá thời gian chờ).
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'kotlin'
      - name: gradle build
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'kotlin'
        working-directory: sdk/kotlin/generated
        # Hàng trăm model: trình biên dịch Kotlin cần nhiều bộ nhớ hơn mặc định.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.compiler.execution.strategy=in-process assemble
      - uses: dart-lang/setup-dart@v1
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'dart'
        with:
          sdk: "3.14.1"
      - name: dart analyze
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'dart'
        working-directory: sdk/dart/generated
        run: |
          dart pub get
          dart run build_runner build
          dart analyze --no-fatal-warnings

  upgrade:
    # Bản phát hành trước ghi dữ liệu, bản này đọc lại trên cùng database (đặc tả 31 B1, D-246).
    # Không trong `./gate.sh`: cần tải hay build image của tag cũ.
    name: upgrade from the last release (${{ matrix.database }})
    if: ${{ !github.event.repository.private && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Lô:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Tải image của bản trước từ ghcr.io.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: chọn tag phát hành trước HEAD.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask upgrade-test --database ${{ matrix.database }}

  secrets:
    name: secret scan (gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Toàn bộ lịch sử: secret đã commit rồi xoá vẫn nằm trong git.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml
