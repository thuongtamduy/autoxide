# CI của Autoxide: gate đầy đủ (giống `./gate.sh` trên máy, chia ba phần chạy song song) trên
# PostgreSQL thấp nhất được hỗ trợ và mới nhất, cộng quét secret trong toàn bộ lịch sử git (D-074). `./gate.sh` trên
# máy vẫn là định nghĩa "xong" (D-173); CI là lưới thứ hai (D-175).
#
# Mọi job chỉ chạy khi repo công khai (D-197): repo riêng tư thì GitHub tính phí runner, nên
# job bị bỏ qua trước khi xin runner — không tốn phút nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay (Actions → Run workflow), vd sau khi đổi cài đặt của repo.
  workflow_dispatch:

permissions:
  contents: read

# Pull request: lần push mới huỷ lần chạy cũ của cùng nhánh. Main thì không huỷ: lần chạy bị huỷ
# không lưu được cache (bước Post của rust-cache không chạy), và trước đây mỗi lần merge huỷ lần
# chạy main trước nên main không bao giờ có cache, mọi PR build từ đầu (D-20261119-ci-faster).
# Không huỷ thì lần chạy main mới chờ lần đang chạy xong; GitHub chỉ giữ một lần chờ (lần mới nhất).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gate tách thành nhiều phần chạy song song, mỗi phần một máy (`./gate.sh --only lint|sqlite|postgres
# --shard k/n`, cộng lại đúng bằng gate một máy), rồi job `gate` gộp kết quả dưới tên check cũ
# (D-20261119-ci-faster).
#
# Cache (Swatinem/rust-cache): chỉ main ghi (`save-if`), pull request chỉ đọc. Cache của pull request
# chỉ nhánh đó đọc được, nên ghi chỉ tốn chỗ trong 10 GB của repo và đẩy cache của main ra. Hai job
# test build ra cùng một bộ file nên dùng chung `shared-key: test`; clippy build khác nên có khoá riêng.
jobs:
  lint:
    name: gate / lint
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: `cargo xtask api-diff` so với tag phát hành gần nhất; gitleaks quét
          # toàn bộ lịch sử.
          fetch-depth: 0
      # Toolchain theo rust-toolchain.toml: không đối số thì rustup cài đúng bản ghim.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }} --only lint

  tests:
    name: gate / ${{ matrix.target.name }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `part`: phần của `./gate.sh --only`; `shard`: phần của `./gate.sh --shard` — test đầu-cuối
        # của `autoxide` (~7–10 phút trên một máy) chia đôi ra hai máy. Postgres thấp nhất được hỗ
        # trợ (STACK.md) và mới nhất: pull request chỉ chạy bản thấp nhất (dễ hỏng nhất) để có kết quả
        # sớm; push lên main và chạy tay thì chạy cả hai (D-20261118-public-ci-openapi-dup).
        target: >-
          ${{ github.event_name == 'pull_request' && fromJSON('[
            {"name": "sqlite 1/2", "part": "sqlite", "shard": "1/2", "postgres": "16"},
            {"name": "sqlite 2/2", "part": "sqlite", "shard": "2/2", "postgres": "16"},
            {"name": "postgres 16 1/2", "part": "postgres", "shard": "1/2", "postgres": "16"},
            {"name": "postgres 16 2/2", "part": "postgres", "shard": "2/2", "postgres": "16"}
          ]') || fromJSON('[
            {"name": "sqlite 1/2", "part": "sqlite", "shard": "1/2", "postgres": "16"},
            {"name": "sqlite 2/2", "part": "sqlite", "shard": "2/2", "postgres": "16"},
            {"name": "postgres 16 1/2", "part": "postgres", "shard": "1/2", "postgres": "16"},
            {"name": "postgres 16 2/2", "part": "postgres", "shard": "2/2", "postgres": "16"},
            {"name": "postgres 18 1/2", "part": "postgres", "shard": "1/2", "postgres": "18"},
            {"name": "postgres 18 2/2", "part": "postgres", "shard": "2/2", "postgres": "18"}
          ]') }}
    services:
      # Job SQLite cũng có service Postgres (khởi động song song với checkout, không tốn thời gian)
      # cho matrix khỏi rẽ nhánh; nó không dùng tới.
      postgres:
        image: postgres:${{ matrix.target.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Máy chủ S3 giả lập cho test lưu file (D-066).
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Database và S3 dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull request so với origin/main để biết crate nào bị sửa (`--pr`).
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          # Một job ghi là đủ: các job test build ra cùng một bộ file.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target.name == 'sqlite 1/2' }}
      # Service container không nhận tham số `-c` của postgres, nên cấu hình như container của
      # gate.sh (max_connections=300, bỏ fsync) bằng ALTER SYSTEM rồi khởi động lại. Mặc định 100
      # kết nối không đủ cho test chạy song song: test đỏ hàng loạt "too many clients".
      - name: Configure the PostgreSQL service like gate.sh
        if: ${{ matrix.target.part == 'postgres' }}
        run: |
          container=${{ job.services.postgres.id }}
          docker exec "$container" psql -U postgres -q \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$container" >/dev/null
          for _ in $(seq 1 30); do
            docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null && \
              docker exec "$container" psql -h 127.0.0.1 -U postgres -tAc "SHOW max_connections" && exit 0
            sleep 1
          done
          exit 1
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      # Pull request: chỉ test crate bị sửa (so với main) và crate phụ thuộc, không doc-test; push lên
      # main và chạy tay: gate đầy đủ (D-20261118-ci-pr-affected-tests).
      - run: >-
          ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }}
          --only ${{ matrix.target.part }} --shard ${{ matrix.target.shard }}

  # Tên check cũ, có thể là check bắt buộc của branch protection: chỉ xanh khi mọi phần của gate
  # xanh. `always()`: phần nào đỏ thì job này vẫn chạy và báo đỏ, không bị bỏ qua (check bị bỏ qua
  # được tính là đạt).
  gate:
    name: gate (PostgreSQL ${{ github.event_name == 'pull_request' && '16' || '16, 18' }})
    if: ${{ always() && !github.event.repository.private }}
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint: $LINT, tests: $TESTS"
          [ "$LINT" = success ] && [ "$TESTS" = success ]

  sdk:
    name: TypeScript SDK and guide examples (tsc)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      # Ví dụ TypeScript của docs/guides kiểm kiểu cùng SDK (đặc tả 31 A5).
      - run: cargo xtask sdk --extract-examples sdk/typescript/examples/guides
      - name: tsc --noEmit
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit

  upgrade:
    # Bản phát hành trước ghi dữ liệu, bản này đọc lại trên cùng database (đặc tả 31 B1, D-246).
    # Không trong `./gate.sh`: cần tải hay build image của tag cũ.
    name: upgrade from the last release (${{ matrix.database }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Tải image của bản trước từ ghcr.io.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: chọn tag phát hành trước HEAD.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask upgrade-test --database ${{ matrix.database }}

  secrets:
    name: secret scan (gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Toàn bộ lịch sử: secret đã commit rồi xoá vẫn nằm trong git.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml
