# CI của Autoxide: gate đầy đủ (giống `./gate.sh` trên máy) trên PostgreSQL thấp nhất
# được hỗ trợ và mới nhất, cộng quét secret trong toàn bộ lịch sử git (D-074). `./gate.sh` trên
# máy vẫn là định nghĩa "xong" (D-173); CI là lưới thứ hai (D-175).
#
# Mọi job chỉ chạy khi repo công khai (D-197): repo riêng tư thì GitHub tính phí runner, nên
# job bị bỏ qua trước khi xin runner — không tốn phút nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay (Actions → Run workflow), vd sau khi đổi cài đặt của repo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (PostgreSQL ${{ matrix.postgres }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Thấp nhất được hỗ trợ (STACK.md) và mới nhất.
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Máy chủ S3 giả lập cho test lưu file (D-066).
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Database và S3 dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: `cargo xtask api-diff` so với tag phát hành gần nhất.
          fetch-depth: 0
      # Toolchain theo rust-toolchain.toml: không đối số thì rustup cài đúng bản ghim.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      - run: ./gate.sh

  sdk:
    name: TypeScript SDK and guide examples (tsc)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      # Ví dụ TypeScript của docs/guides kiểm kiểu cùng SDK (đặc tả 31 A5).
      - run: cargo xtask sdk --extract-examples sdk/typescript/examples/guides
      - name: tsc --noEmit
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit

  upgrade:
    # Bản phát hành trước ghi dữ liệu, bản này đọc lại trên cùng database (đặc tả 31 B1, D-246).
    # Không trong `./gate.sh`: cần tải hay build image của tag cũ.
    name: upgrade from the last release (${{ matrix.database }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Tải image của bản trước từ ghcr.io.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: chọn tag phát hành trước HEAD.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask upgrade-test --database ${{ matrix.database }}

  secrets:
    name: secret scan (gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Toàn bộ lịch sử: secret đã commit rồi xoá vẫn nằm trong git.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml
