# CI của Autoxide: gate đầy đủ (giống `./gate.sh` trên máy, chia ba phần chạy song song) trên
# PostgreSQL thấp nhất được hỗ trợ và mới nhất, cộng quét secret trong toàn bộ lịch sử git (D-074). `./gate.sh` trên
# máy vẫn là định nghĩa "xong" (D-173); CI là lưới thứ hai (D-175).
#
# Mọi job chỉ chạy khi repo công khai (D-197): repo riêng tư thì GitHub tính phí runner, nên
# job bị bỏ qua trước khi xin runner — không tốn phút nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay (Actions → Run workflow), vd sau khi đổi cài đặt của repo.
  workflow_dispatch:

permissions:
  contents: read

# Pull request: lần push mới huỷ lần chạy cũ của cùng nhánh. Main thì không huỷ: lần chạy bị huỷ
# không lưu được cache (bước Post của rust-cache không chạy), và trước đây mỗi lần merge huỷ lần
# chạy main trước nên main không bao giờ có cache, mọi PR build từ đầu (D-20261119-ci-faster).
# Không huỷ thì lần chạy main mới chờ lần đang chạy xong; GitHub chỉ giữ một lần chờ (lần mới nhất).
# PR ghép lô của phiên điều phối (tiêu đề bắt đầu bằng "Lô:") chạy CI đầy đủ như mọi PR: phiên điều phối
# ghép, sinh lại file tự động, chạy `cargo xtask check` + `cargo xtask sdk --check`, push PR lô rồi chờ CI
# xanh mới merge (D-20261121-ci-batch-release-faster, thay phần "kiểm trên máy" của D-20261119-merge-batches).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gate tách thành nhiều phần chạy song song, mỗi phần một máy (`./gate.sh --only lint`, `--only build`
# rồi `--only sqlite|postgres --archive … --shard k/n`; cộng lại đúng bằng gate một máy), định nghĩa ở
# gate.yml (dùng chung với release.yml, D-20261120-release-gate-sharded); job `gate (PostgreSQL …)` gộp
# kết quả dưới tên check cũ (D-20261119-ci-faster, D-20261120-ci-nextest-archive). Cache: xem gate.yml.
jobs:
  # Gate chia nhiều máy, định nghĩa ở gate.yml (dùng chung với release.yml). Tên job gọi `gate` nên các
  # check vẫn tên "gate / lint", "gate / build tests", "gate / sqlite 1/4"… như khi còn nằm ở đây.
  parts:
    name: gate
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/gate.yml
    with:
      # Pull request chỉ chạy PostgreSQL thấp nhất (có kết quả sớm); push main và chạy tay chạy cả hai.
      postgres-18: ${{ github.event_name != 'pull_request' }}

  # Tên check cũ, có thể là check bắt buộc của branch protection: chỉ xanh khi mọi phần của gate
  # xanh. `always()`: phần nào đỏ thì job này vẫn chạy và báo đỏ, không bị bỏ qua (check bị bỏ qua
  # được tính là đạt).
  gate:
    name: gate (PostgreSQL ${{ github.event_name == 'pull_request' && '16' || '16, 18' }})
    if: ${{ always() && !github.event.repository.private }}
    needs: parts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every part of the gate passed
        env:
          GATE: ${{ needs.parts.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "gate: $GATE"
          # Lần chạy bị huỷ vì đã có commit mới hơn trên cùng PR (concurrency.cancel-in-progress) thì
          # kết quả của commit cũ không còn ý nghĩa: không báo đỏ để khỏi bắn thông báo "CI failed" giả
          # (D-20261125-ci-cancelled-not-failed). Bị huỷ mà commit này VẪN là đầu PR (huỷ tay) hay lỗi
          # khi hỏi GitHub thì vẫn đỏ: không bao giờ tính bị huỷ là xanh cho commit hiện tại.
          superseded() {
            [ "$EVENT" = pull_request ] || return 1
            live="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" || return 1
            [ -n "$live" ] && [ "$live" != "$PR_HEAD_SHA" ]
          }
          [ "$GATE" = success ] && exit 0
          if [ "$GATE" = cancelled ] && superseded; then
            echo "::notice title=Superseded::this run was cancelled by a newer commit on the pull request"
            exit 0
          fi
          exit 1

  sdk:
    name: TypeScript SDK and guide examples (tsc)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      # Ví dụ TypeScript của docs/guides kiểm kiểu cùng SDK (đặc tả 31 A5).
      - run: cargo xtask sdk --extract-examples sdk/typescript/examples/guides
      - name: tsc --noEmit
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit
      # SDK phát hành dạng mã nguồn `.ts`, người dùng biên dịch bằng TypeScript của họ: kiểm thêm bản thấp nhất cam kết
      # hỗ trợ (D-20261125-typescript-range), không chỉ bản 7 dùng để phát triển.
      - name: tsc --noEmit (lowest supported TypeScript)
        working-directory: sdk/typescript
        run: npx --yes --package typescript@5.0.4 -- tsc --noEmit

  # Hợp đồng Rust (bước 70 P4, docs/COMPATIBILITY.md): `cargo semver-checks` so phần công khai của
  # autoxide-kernel, autoxide-testkit, `autoxide` (thư viện) và crate của module core / official.
  # - PR PHÁT HÀNH (đổi `version` của Cargo.toml gốc): mọi crate hợp đồng so với tag phát hành trước; mục
  #   `### Breaking (Rust)` ghi vào tóm tắt của job để chép vào CHANGELOG.md trước khi merge. PR sửa chính bộ kiểm
  #   (`xtask/src/semver.rs`) cũng so mọi crate với tag trước, để chứng minh nó còn chạy xong trong giới hạn.
  # - PR khác chạm phần công khai (crates/kernel, crates/testkit, crates/app/src/lib.rs, modules/*/src/lib.rs,
  #   modules/*/src/api*): chỉ crate bị chạm, so với nhánh gốc của PR — báo sớm cho người sửa.
  # - Còn lại: bỏ qua, job vẫn báo xong. Job riêng, không nằm trên đường của gate.
  # Còn `0.x` thì chỉ cảnh báo; từ 1.0 `cargo xtask semver` tự thất bại khi có phá vỡ (D-242) — cách bật chặn ở
  # docs/RELEASING.md, mục "Kiểm hợp đồng Rust".
  # Crate chia ra 4 máy (`--shard k/4`), mỗi máy một target dir chung cho mọi crate của nó; job
  # "Rust API compatibility (cargo-semver-checks)" gộp kết quả và là tên check ổn định (D-20261125-semver-job-time).
  semver-plan:
    name: semver (plan)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.changed.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version() { sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' | head -n 1; }
          before="$(git show "$BASE_SHA:Cargo.toml" | version)"
          after="$(version < Cargo.toml)"
          public='^(crates/kernel/|crates/testkit/|crates/app/src/lib\.rs$|modules/[^/]+/src/(lib\.rs$|api\.rs$|api/))'
          if [ "$before" != "$after" ] || git diff --name-only "$BASE_SHA...HEAD" | grep -Eq '^xtask/src/semver\.rs$'; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...HEAD" | grep -Eq "$public"; then
            echo "mode=pull-request" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No public Rust API changed and the version is unchanged ($after): semver check skipped."
          fi

  semver-shards:
    name: semver ${{ matrix.shard }}/4
    needs: semver-plan
    if: ${{ needs.semver-plan.outputs.mode != 'skip' }}
    runs-on: ubuntu-24.04
    # Đo ở #506 (đủ 28 crate): các phần 12–22 phút, cả job ~23 phút; giới hạn chỉ để chặn job treo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cả lịch sử và tag: so với tag phát hành trước hay nhánh gốc của PR.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-semver-checks@0.51.0
      - name: cargo xtask semver
        env:
          MODE: ${{ needs.semver-plan.outputs.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          if [ "$MODE" = release ]; then
            args=()
          else
            args=(--base "$BASE_SHA" --changed "$BASE_SHA")
          fi
          # Từ 1.0 lệnh thoát 1 khi có phá vỡ: vẫn tải kết quả lên rồi mới báo đỏ (job gộp đọc nó).
          status=0
          cargo xtask semver --markdown "${args[@]}" --shard "$SHARD/4" > semver.md || status=$?
          cat semver.md
          echo "$status" > status
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semver-${{ matrix.shard }}
          path: |
            semver.md
            status
          if-no-files-found: error
          retention-days: 1

  semver:
    name: Rust API compatibility (cargo-semver-checks)
    needs: [semver-plan, semver-shards]
    permissions:
      contents: read
      pull-requests: read
    # `always()`: phần nào đỏ thì job này vẫn chạy và báo đỏ (check bị bỏ qua được tính là đạt).
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Shards cancelled by a newer commit upload nothing: skip the download then, but never hide a download
        # failure when the shards ran.
        if: needs.semver-plan.outputs.mode != 'skip' && needs.semver-shards.result != 'cancelled'
        with:
          pattern: semver-*
          path: parts
      - name: Every part of the check passed; one summary
        env:
          PLAN: ${{ needs.semver-plan.result }}
          MODE: ${{ needs.semver-plan.outputs.mode }}
          SHARDS: ${{ needs.semver-shards.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "plan: $PLAN ($MODE), shards: $SHARDS"
          # Lần chạy bị huỷ vì đã có commit mới hơn trên cùng PR (concurrency.cancel-in-progress) thì
          # kết quả của commit cũ không còn ý nghĩa: không báo đỏ để khỏi bắn thông báo "CI failed" giả
          # (D-20261125-ci-cancelled-not-failed). Bị huỷ mà commit này VẪN là đầu PR (huỷ tay) hay lỗi
          # khi hỏi GitHub thì vẫn đỏ: không bao giờ tính bị huỷ là xanh cho commit hiện tại.
          superseded() {
            [ "$EVENT" = pull_request ] || return 1
            live="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" || return 1
            [ -n "$live" ] && [ "$live" != "$PR_HEAD_SHA" ]
          }
          if { [ "$PLAN" = cancelled ] || [ "$SHARDS" = cancelled ]; } && superseded; then
            echo "::notice title=Superseded::this run was cancelled by a newer commit on the pull request"
            exit 0
          fi
          [ "$PLAN" = success ] || exit 1
          [ "$MODE" = skip ] && exit 0
          # Shards passed but a report is missing: the list of breaking changes would be lost silently, so fail.
          if [ "$SHARDS" = success ]; then
            for part in 1 2 3 4; do
              [ -f "parts/semver-$part/semver.md" ] || { echo "::error::missing report of semver shard $part"; exit 1; }
            done
          fi
          if [ "$MODE" = release ]; then title="since the last release"; else title="in this pull request"; fi
          # Mỗi phần in `### Breaking (Rust)` + các dòng `- …`: gộp thành một mục, theo thứ tự phần.
          for part in 1 2 3 4; do grep -h '^- ' "parts/semver-$part/semver.md" || true; done > lines.md
          {
            echo "## Breaking changes to the public Rust API $title"
            echo
            if [ -s lines.md ]; then
              if [ "$MODE" = release ]; then
                echo "Copy this section into the release's section of \`CHANGELOG.md\`:"
              else
                echo "Before 1.0 this is a warning. From 1.0 a breaking change needs a new major version (docs/COMPATIBILITY.md)."
              fi
              echo
              echo "### Breaking (Rust)"
              echo
              cat lines.md
            else
              echo "None found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s lines.md ]; then
            echo "::warning title=Breaking Rust API change::cargo-semver-checks found breaking changes $title; see the job summary."
          fi
          [ "$SHARDS" = success ]

  upgrade:
    # Bản phát hành trước ghi dữ liệu, bản này đọc lại trên cùng database (đặc tả 31 B1, D-246).
    # Không trong `./gate.sh`: cần tải hay build image của tag cũ.
    name: upgrade from the last release (${{ matrix.database }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Tải image của bản trước từ ghcr.io.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cả lịch sử và tag: chọn tag phát hành trước HEAD; và để so với nhánh gốc của PR.
          fetch-depth: 0
      # D-20261121-ci-batch-release-faster: ở pull request, test nâng cấp chỉ chạy khi PR đụng thứ có thể
      # đổi dạng dữ liệu đã lưu (migration, entity, kernel/data, Cargo.lock, chính test nâng cấp, workflow,
      # Dockerfile). Push vào `main` và chạy tay luôn chạy. Kiểm trong một bước (không dùng `paths:` ở trigger)
      # để job vẫn báo xong khi nó là check bắt buộc.
      - name: changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='(^|/)migrations?(/|\.rs$)|(^|/)entity(/|\.rs$)|^crates/kernel/src/data/|^Cargo\.lock$|^xtask/src/upgrade\.rs$|^crates/app/tests/.*upgrade|^\.github/workflows/|(^|/)Dockerfile'
          if git diff --name-only "$BASE_SHA" HEAD | grep -E -q "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This pull request does not touch migrations, entities or the stored format: upgrade test skipped."
          fi
      - run: rustup toolchain install
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.changed.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask upgrade-test --database ${{ matrix.database }}
        if: steps.changed.outputs.run == 'true'

  # Kiểm bảo mật và cú pháp của chính các workflow (D-20261123-supply-chain): zizmor (quyền token, action chưa ghim
  # SHA hay SHA không thuộc repo của action, chèn lệnh từ dữ liệu PR, trigger nguy hiểm, lộ credential qua checkout)
  # và actionlint (cú pháp, biểu thức, shellcheck cho `run:`). Cấu hình zizmor: .github/zizmor.yml. Chạy trên máy:
  # `pip install zizmor==<bản ở STACK.md> actionlint-py` rồi `zizmor --offline .github && actionlint`.
  workflows:
    name: workflow security (zizmor, actionlint)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: zizmor@1.32.0
      # Không có action cài actionlint được ghim sẵn: tải bản phát hành chính thức, kiểm SHA-256 ghim ở đây.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # Có token thì zizmor kiểm thêm phần cần mạng: SHA ghim có thật thuộc repo của action không, action có lỗ hổng
      # đã công bố không.
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --format=github .github

  secrets:
    name: secret scan (gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Toàn bộ lịch sử của ref được checkout: secret đã commit rồi xoá vẫn nằm trong git.
          # Nhánh khác (chưa có PR) cũng được fetch nhưng KHÔNG quét — xem `--log-opts` bên dưới.
          fetch-depth: 0
      - name: gitleaks
        # Image ghim theo digest ở .github/gitleaks/Dockerfile, cùng chỗ gate.sh đọc (D-20261125-gitleaks-digest).
        # `--log-opts=HEAD`: không truyền thì gitleaks quét MỌI ref đã fetch (`git log --all`), nên một nhánh
        # của phiên khác làm đỏ mọi PR. HEAD là ref đang checkout (PR: merge ref = lịch sử main + commit của PR;
        # push lên main: main) và vẫn là TOÀN BỘ lịch sử đi tới được từ đó (D-20261125-gitleaks-scope).
        run: |
          image="$(sed -n 's/^FROM //p' .github/gitleaks/Dockerfile)"
          docker run --rm -v "$PWD:/repo" "$image" \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml --log-opts=HEAD

  # DCO (D-20261126-road-to-1-0, G8): mỗi commit của pull request có `Signed-off-by`, trừ khi người mở PR là người duy trì
  # (login trong CODEOWNERS; login do GitHub xác thực, không giả được). Chỉ chạy trên pull request: push main đã đi qua PR.
  dco:
    name: DCO sign-off
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA" "$PR_AUTHOR"

  # MSRV (D-20261126-road-to-1-0, G8; docs/COMPATIBILITY.md, "Minimum supported Rust version"): biên dịch cả workspace
  # bằng đúng `rust-version` của Cargo.toml — thấp hơn toolchain ghim — để một tính năng ngôn ngữ mới không lọt vào mà
  # không ai biết. Chỉ `cargo check` (không test): MSRV là lời hứa "biên dịch được". Pull request không chạm Rust thì bỏ
  # qua như phần nặng của gate (`scripts/rust-changed.sh`); push main và chạy tay luôn chạy.
  msrv:
    name: MSRV build (rust-version)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust changed, and the MSRV
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            run="$(scripts/rust-changed.sh "origin/$BASE_REF")"
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install the MSRV toolchain
        if: steps.plan.outputs.run == 'true'
        env:
          MSRV: ${{ steps.plan.outputs.msrv }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.plan.outputs.run == 'true'
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check with the MSRV
        if: steps.plan.outputs.run == 'true'
        env:
          MSRV: ${{ steps.plan.outputs.msrv }}
        # `+$MSRV` thắng `rust-toolchain.toml`. `--locked`: Cargo.lock không được đổi.
        run: cargo "+$MSRV" check --workspace --locked

  # REUSE (REUSE.toml, LICENSES/): mọi file có thông tin bản quyền và giấy phép SPDX. Công cụ ghim phiên bản.
  reuse:
    name: REUSE compliance
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==6.3.0 lint
