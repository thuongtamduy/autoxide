# CI của Autoxide: gate đầy đủ (giống `./gate.sh` trên máy, chia ba phần chạy song song) trên
# PostgreSQL thấp nhất được hỗ trợ và mới nhất, cộng quét secret trong toàn bộ lịch sử git (D-074). `./gate.sh` trên
# máy vẫn là định nghĩa "xong" (D-173); CI là lưới thứ hai (D-175).
#
# Mọi job chỉ chạy khi repo công khai (D-197): repo riêng tư thì GitHub tính phí runner, nên
# job bị bỏ qua trước khi xin runner — không tốn phút nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay (Actions → Run workflow), vd sau khi đổi cài đặt của repo.
  workflow_dispatch:

permissions:
  contents: read

# Pull request: lần push mới huỷ lần chạy cũ của cùng nhánh. Main thì không huỷ: lần chạy bị huỷ
# không lưu được cache (bước Post của rust-cache không chạy), và trước đây mỗi lần merge huỷ lần
# chạy main trước nên main không bao giờ có cache, mọi PR build từ đầu (D-20261119-ci-faster).
# Không huỷ thì lần chạy main mới chờ lần đang chạy xong; GitHub chỉ giữ một lần chờ (lần mới nhất).
# PR ghép lô của phiên điều phối (tiêu đề bắt đầu bằng "Lô:") chạy CI đầy đủ như mọi PR: phiên điều phối
# ghép, sinh lại file tự động, chạy `cargo xtask check` + `cargo xtask sdk --check`, push PR lô rồi chờ CI
# xanh mới merge (D-20261121-ci-batch-release-faster, thay phần "kiểm trên máy" của D-20261119-merge-batches).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gate tách thành nhiều phần chạy song song, mỗi phần một máy (`./gate.sh --only lint`, `--only build`
# rồi `--only sqlite|postgres --archive … --shard k/n`; cộng lại đúng bằng gate một máy), định nghĩa ở
# gate.yml (dùng chung với release.yml, D-20261120-release-gate-sharded); job `gate (PostgreSQL …)` gộp
# kết quả dưới tên check cũ (D-20261119-ci-faster, D-20261120-ci-nextest-archive). Cache: xem gate.yml.
jobs:
  # Một job quyết định mọi phần "chỉ chạy khi file liên quan đổi" (D-20261127-ci-runner-budget). Job bị bỏ qua ở mức JOB
  # (`if:` dưới đây) không xin máy nào và được tính là đạt; trước đây mỗi job tự xin một máy, checkout cả lịch sử rồi mới
  # biết mình không cần chạy. So với đâu:
  # - pull request: nhánh gốc của PR (`base.sha`), như trước;
  # - push vào `main`: commit của lần CI xanh gần nhất trên `main` — không phải commit liền trước, để thay đổi của lần
  #   chạy bị huỷ (lần chờ bị thay bởi lần mới hơn) hay đỏ vẫn được tính. Không tìm được (chưa có lần xanh, commit đó không
  #   còn là tổ tiên) thì chạy hết;
  # - chạy tay: chạy hết.
  # Commit phát hành luôn đổi `Cargo.toml` và `Cargo.lock` nên mọi phần dưới đây chạy trên đúng commit được phát hành
  # (auto-release.yml dùng lại CI xanh của commit đó). Gate (gate.yml) không thuộc job này: push `main` luôn chạy đủ.
  plan:
    name: plan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Đọc lần chạy CI xanh gần nhất trên `main`.
      actions: read
    outputs:
      upgrade: ${{ steps.plan.outputs.upgrade }}
      image: ${{ steps.plan.outputs.image }}
      mcp: ${{ steps.plan.outputs.mcp }}
      alerts: ${{ steps.plan.outputs.alerts }}
      rust: ${{ steps.plan.outputs.rust }}
      semver: ${{ steps.plan.outputs.semver }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: What changed, and which checks it needs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$BASE_SHA" ;;
            push)
              green="$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f branch=main -f event=push \
                -f status=success -f per_page=1 --jq '.workflow_runs[0].head_sha // empty' || true)"
              if [ -n "$green" ] && git merge-base --is-ancestor "$green" HEAD 2>/dev/null; then
                base="$green"
              fi
              ;;
          esac
          if [ -n "$base" ]; then
            echo "Changes since $base:"
            changed="$(git diff --name-only "$base" HEAD)"
            printf '%s\n' "$changed"
          else
            echo "No base to compare with ($EVENT): every check runs."
          fi
          # Có file nào đã đổi khớp mẫu (regex mở rộng) không; không có mốc so sánh thì luôn có.
          touches() {
            [ -z "$base" ] && { echo true; return; }
            if grep -E -q "$1" <<<"$changed"; then echo true; else echo false; fi
          }
          {
            # Test nâng cấp (D-20261121-ci-batch-release-faster): thứ có thể đổi dạng dữ liệu đã lưu.
            echo "upgrade=$(touches '(^|/)migrations?(/|\.rs$)|(^|/)entity(/|\.rs$)|^crates/kernel/src/data/|^Cargo\.lock$|^xtask/src/upgrade\.rs$|^crates/app/tests/.*upgrade|^\.github/workflows/|(^|/)Dockerfile')"
            # Dựng thử image: thứ làm nên image.
            echo "image=$(touches '^(Dockerfile|\.dockerignore|about\.toml|about\.hbs|deny\.toml|rust-toolchain\.toml|Cargo\.lock)$|^\.github/workflows/(release|ci)\.yml$')"
            # OAuth cho MCP bằng client MCP chính thức (D-20261127-mcp-sdk-ci-check).
            echo "mcp=$(touches '^modules/auth/|^crates/kernel/src/(http|mcp|security|data/|module)|^crates/app/|^scripts/mcp-oauth|^Cargo\.(lock|toml)$|^\.github/workflows/ci\.yml$')"
            # Luật cảnh báo Prometheus.
            echo "alerts=$(touches '^deploy/prometheus/|^\.github/workflows/ci\.yml$')"
          } >> "$GITHUB_OUTPUT"
          # Có chạm Rust không (D-20261125-ci-skip-rust): MSRV.
          if [ -n "$base" ]; then
            echo "rust=$(scripts/rust-changed.sh "$base")" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
          # Hợp đồng Rust (chỉ pull request, xem job `semver`) và PR phát hành (đổi `version` của Cargo.toml gốc).
          semver=skip
          release=false
          if [ "$EVENT" = pull_request ]; then
            version() { sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' | head -n 1; }
            before="$(git show "$BASE_SHA:Cargo.toml" | version)"
            after="$(version < Cargo.toml)"
            public='^(crates/kernel/|crates/testkit/|crates/app/src/lib\.rs$|modules/[^/]+/src/(lib\.rs$|api\.rs$|api/))'
            [ "$before" != "$after" ] && release=true
            if [ "$release" = true ] || grep -Eq '^xtask/src/semver\.rs$' <<<"$changed"; then
              semver=release
            elif grep -Eq "$public" <<<"$changed"; then
              semver=pull-request
            else
              echo "No public Rust API changed and the version is unchanged ($after): semver check skipped."
            fi
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Gate chia nhiều máy, định nghĩa ở gate.yml (dùng chung với release.yml). Tên job gọi `gate` nên các
  # check vẫn tên "gate / lint", "gate / build tests", "gate / sqlite 1/4"… như khi còn nằm ở đây.
  parts:
    name: gate
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/gate.yml
    with:
      # Pull request chỉ chạy PostgreSQL thấp nhất (có kết quả sớm); push main và chạy tay chạy cả hai.
      postgres-18: ${{ github.event_name != 'pull_request' }}

  # Tên check cũ, có thể là check bắt buộc của branch protection: chỉ xanh khi mọi phần của gate
  # xanh. `always()`: phần nào đỏ thì job này vẫn chạy và báo đỏ, không bị bỏ qua (check bị bỏ qua
  # được tính là đạt).
  gate:
    name: gate (PostgreSQL ${{ github.event_name == 'pull_request' && '16' || '16, 18' }})
    if: ${{ always() && !github.event.repository.private }}
    needs: parts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every part of the gate passed
        env:
          GATE: ${{ needs.parts.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "gate: $GATE"
          # Lần chạy bị huỷ vì đã có commit mới hơn trên cùng PR (concurrency.cancel-in-progress) thì
          # kết quả của commit cũ không còn ý nghĩa: không báo đỏ để khỏi bắn thông báo "CI failed" giả
          # (D-20261125-ci-cancelled-not-failed). Bị huỷ mà commit này VẪN là đầu PR (huỷ tay) hay lỗi
          # khi hỏi GitHub thì vẫn đỏ: không bao giờ tính bị huỷ là xanh cho commit hiện tại.
          superseded() {
            [ "$EVENT" = pull_request ] || return 1
            live="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" || return 1
            [ -n "$live" ] && [ "$live" != "$PR_HEAD_SHA" ]
          }
          [ "$GATE" = success ] && exit 0
          if [ "$GATE" = cancelled ] && superseded; then
            echo "::notice title=Superseded::this run was cancelled by a newer commit on the pull request"
            exit 0
          fi
          exit 1

  sdk:
    name: TypeScript SDK and guide examples (tsc)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      # Ví dụ TypeScript của docs/guides kiểm kiểu cùng SDK (đặc tả 31 A5).
      - run: cargo xtask sdk --extract-examples sdk/typescript/examples/guides
      - name: tsc --noEmit
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit
      # SDK phát hành dạng mã nguồn `.ts`, người dùng biên dịch bằng TypeScript của họ: kiểm thêm bản thấp nhất cam kết
      # hỗ trợ (D-20261125-typescript-range), không chỉ bản 7 dùng để phát triển.
      - name: tsc --noEmit (lowest supported TypeScript)
        working-directory: sdk/typescript
        run: npx --yes --package typescript@5.0.4 -- tsc --noEmit

  # Đăng nhập OAuth cho MCP bằng client MCP CHÍNH THỨC (`@modelcontextprotocol/sdk`, ghim ở scripts/mcp-oauth/) tới
  # `autoxide serve` thật, trên SQLite rồi PostgreSQL: khám phá `/.well-known`, đăng ký client, PKCE, consent, gọi tool,
  # refresh, thu hồi (D-20261127-mcp-sdk-ci-check). Chỉ chạy khi thay đổi chạm phần có thể đổi luồng đó (job `plan`).
  mcp-oauth:
    name: MCP OAuth with the official MCP SDK client
    needs: plan
    if: ${{ needs.plan.outputs.mcp == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - run: cargo build --locked -p autoxide
      - run: scripts/mcp-oauth-e2e.sh
        env:
          MCP_OAUTH_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  # Hợp đồng Rust (bước 70 P4, docs/COMPATIBILITY.md): `cargo semver-checks` so phần công khai của
  # autoxide-kernel, autoxide-testkit, `autoxide` (thư viện) và crate của module core / official.
  # - PR PHÁT HÀNH (đổi `version` của Cargo.toml gốc): mọi crate hợp đồng so với tag phát hành trước; mục
  #   `### Breaking (Rust)` ghi vào tóm tắt của job để chép vào CHANGELOG.md trước khi merge. PR sửa chính bộ kiểm
  #   (`xtask/src/semver.rs`) cũng so mọi crate với tag trước, để chứng minh nó còn chạy xong trong giới hạn.
  # - PR khác chạm phần công khai (crates/kernel, crates/testkit, crates/app/src/lib.rs, modules/*/src/lib.rs,
  #   modules/*/src/api*): chỉ crate bị chạm, so với nhánh gốc của PR — báo sớm cho người sửa.
  # - Còn lại: bỏ qua, job vẫn báo xong. Job riêng, không nằm trên đường của gate.
  # Còn `0.x` thì chỉ cảnh báo; từ 1.0 `cargo xtask semver` tự thất bại khi có phá vỡ (D-242) — cách bật chặn ở
  # docs/RELEASING.md, mục "Kiểm hợp đồng Rust".
  # Crate chia ra 4 máy (`--shard k/4`), mỗi máy một target dir chung cho mọi crate của nó; job
  # "Rust API compatibility (cargo-semver-checks)" gộp kết quả và là tên check ổn định (D-20261125-semver-job-time).
  # Chế độ (release / pull-request / skip) do job `plan` tính (D-20261127-ci-runner-budget).
  semver-shards:
    name: semver ${{ matrix.shard }}/4
    needs: plan
    if: ${{ needs.plan.outputs.semver != 'skip' }}
    runs-on: ubuntu-24.04
    # Đo ở #506 (đủ 28 crate): các phần 12–22 phút, cả job ~23 phút; giới hạn chỉ để chặn job treo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cả lịch sử và tag: so với tag phát hành trước hay nhánh gốc của PR.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-semver-checks@0.51.0
      - name: cargo xtask semver
        env:
          MODE: ${{ needs.plan.outputs.semver }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          if [ "$MODE" = release ]; then
            args=()
          else
            args=(--base "$BASE_SHA" --changed "$BASE_SHA")
          fi
          # Từ 1.0 lệnh thoát 1 khi có phá vỡ: vẫn tải kết quả lên rồi mới báo đỏ (job gộp đọc nó).
          status=0
          cargo xtask semver --markdown "${args[@]}" --shard "$SHARD/4" > semver.md || status=$?
          cat semver.md
          echo "$status" > status
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semver-${{ matrix.shard }}
          path: |
            semver.md
            status
          if-no-files-found: error
          retention-days: 1

  semver:
    name: Rust API compatibility (cargo-semver-checks)
    needs: [plan, semver-shards]
    permissions:
      contents: read
      pull-requests: read
    # `always()`: phần nào đỏ thì job này vẫn chạy và báo đỏ (check bị bỏ qua được tính là đạt).
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Shards cancelled by a newer commit upload nothing: skip the download then, but never hide a download
        # failure when the shards ran.
        if: needs.plan.outputs.semver != 'skip' && needs.semver-shards.result != 'cancelled'
        with:
          pattern: semver-*
          path: parts
      - name: Every part of the check passed; one summary
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.semver }}
          SHARDS: ${{ needs.semver-shards.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "plan: $PLAN ($MODE), shards: $SHARDS"
          # Lần chạy bị huỷ vì đã có commit mới hơn trên cùng PR (concurrency.cancel-in-progress) thì
          # kết quả của commit cũ không còn ý nghĩa: không báo đỏ để khỏi bắn thông báo "CI failed" giả
          # (D-20261125-ci-cancelled-not-failed). Bị huỷ mà commit này VẪN là đầu PR (huỷ tay) hay lỗi
          # khi hỏi GitHub thì vẫn đỏ: không bao giờ tính bị huỷ là xanh cho commit hiện tại.
          superseded() {
            [ "$EVENT" = pull_request ] || return 1
            live="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" || return 1
            [ -n "$live" ] && [ "$live" != "$PR_HEAD_SHA" ]
          }
          if { [ "$PLAN" = cancelled ] || [ "$SHARDS" = cancelled ]; } && superseded; then
            echo "::notice title=Superseded::this run was cancelled by a newer commit on the pull request"
            exit 0
          fi
          [ "$PLAN" = success ] || exit 1
          [ "$MODE" = skip ] && exit 0
          # Shards passed but a report is missing: the list of breaking changes would be lost silently, so fail.
          if [ "$SHARDS" = success ]; then
            for part in 1 2 3 4; do
              [ -f "parts/semver-$part/semver.md" ] || { echo "::error::missing report of semver shard $part"; exit 1; }
            done
          fi
          if [ "$MODE" = release ]; then title="since the last release"; else title="in this pull request"; fi
          # Mỗi phần in `### Breaking (Rust)` + các dòng `- …`: gộp thành một mục, theo thứ tự phần.
          for part in 1 2 3 4; do grep -h '^- ' "parts/semver-$part/semver.md" || true; done > lines.md
          {
            echo "## Breaking changes to the public Rust API $title"
            echo
            if [ -s lines.md ]; then
              if [ "$MODE" = release ]; then
                echo "Copy this section into the release's section of \`CHANGELOG.md\`:"
              else
                echo "Before 1.0 this is a warning. From 1.0 a breaking change needs a new major version (docs/COMPATIBILITY.md)."
              fi
              echo
              echo "### Breaking (Rust)"
              echo
              cat lines.md
            else
              echo "None found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s lines.md ]; then
            echo "::warning title=Breaking Rust API change::cargo-semver-checks found breaking changes $title; see the job summary."
          fi
          [ "$SHARDS" = success ]

  # Đóng gói như crates.io (docs/RELEASING.md, "Đăng lên crates.io"; D-20261127-ci-runner-budget): `cargo xtask publish-check`
  # chạy `cargo package` cho mọi crate sẽ đăng rồi build từng gói từ bản đã đóng với phiên bản thư viện mới nhất hợp lệ.
  # Chỉ trên PR PHÁT HÀNH (đổi `version`), song song với mọi job khác; trước đây chạy tay trên máy (~85 phút). Lâu như một
  # lần build sạch (không dùng cache: `--exclude-lockfile` chọn thư viện mới nhất, khác `Cargo.lock`). Không đăng gì.
  publish-check:
    name: crates.io packaging (publish-check)
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Gói đã đóng không mang `[profile]` của workspace nên mặc định build kèm đầy đủ thông tin debug: tắt để đỡ đĩa và
      # thời gian. Không đổi điều được kiểm (gói có đóng và build được không).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # Máy miễn phí còn ~14 GB đĩa trống; build ~43 gói riêng lẻ cần nhiều hơn. Xoá bộ công cụ không dùng (Android, .NET,
      # Haskell, CodeQL) của image runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo xtask publish-check
      - run: df -h /
        if: always()

  upgrade:
    # Bản phát hành trước ghi dữ liệu, bản này đọc lại trên cùng database (đặc tả 31 B1, D-246).
    # Không trong `./gate.sh`: cần tải hay build image của tag cũ.
    name: upgrade from the last release (${{ matrix.database }})
    # Chỉ khi thay đổi có thể đổi dạng dữ liệu đã lưu (job `plan`, D-20261121-ci-batch-release-faster).
    needs: plan
    if: ${{ needs.plan.outputs.upgrade == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Tải image của bản trước từ ghcr.io.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cả lịch sử và tag: chọn tag phát hành trước HEAD.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask upgrade-test --database ${{ matrix.database }}

  # Kiểm bảo mật và cú pháp của chính các workflow (D-20261123-supply-chain): zizmor (quyền token, action chưa ghim
  # SHA hay SHA không thuộc repo của action, chèn lệnh từ dữ liệu PR, trigger nguy hiểm, lộ credential qua checkout)
  # và actionlint (cú pháp, biểu thức, shellcheck cho `run:`). Cấu hình zizmor: .github/zizmor.yml. Chạy trên máy:
  # `pip install zizmor==<bản ở STACK.md> actionlint-py` rồi `zizmor --offline .github && actionlint`.
  workflows:
    name: workflow security (zizmor, actionlint)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: zizmor@1.32.0
      # Không có action cài actionlint được ghim sẵn: tải bản phát hành chính thức, kiểm SHA-256 ghim ở đây.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # Có token thì zizmor kiểm thêm phần cần mạng: SHA ghim có thật thuộc repo của action không, action có lỗ hổng
      # đã công bố không.
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --format=github .github

  secrets:
    name: secret scan (gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Toàn bộ lịch sử của ref được checkout: secret đã commit rồi xoá vẫn nằm trong git.
          # Nhánh khác (chưa có PR) cũng được fetch nhưng KHÔNG quét — xem `--log-opts` bên dưới.
          fetch-depth: 0
      - name: gitleaks
        # Image ghim theo digest ở .github/gitleaks/Dockerfile, cùng chỗ gate.sh đọc (D-20261125-gitleaks-digest).
        # `--log-opts=HEAD`: không truyền thì gitleaks quét MỌI ref đã fetch (`git log --all`), nên một nhánh
        # của phiên khác làm đỏ mọi PR. HEAD là ref đang checkout (PR: merge ref = lịch sử main + commit của PR;
        # push lên main: main) và vẫn là TOÀN BỘ lịch sử đi tới được từ đó (D-20261125-gitleaks-scope).
        run: |
          image="$(sed -n 's/^FROM //p' .github/gitleaks/Dockerfile)"
          docker run --rm -v "$PWD:/repo" "$image" \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml --log-opts=HEAD

  # DCO (D-20261126-road-to-1-0, G8): mỗi commit của pull request có `Signed-off-by`, trừ khi người mở PR là người duy trì
  # (login trong CODEOWNERS của nhánh ĐÍCH, đọc từ base chứ không từ PR; login do GitHub xác thực). Chỉ chạy trên pull request: push main đã đi qua PR.
  dco:
    name: DCO sign-off
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The check itself behaves (scripts/test-check-dco.sh)
        run: scripts/test-check-dco.sh
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA" "$PR_AUTHOR"

  # MSRV (D-20261126-road-to-1-0, G8; docs/COMPATIBILITY.md, "Minimum supported Rust version"): biên dịch cả workspace
  # bằng đúng `rust-version` của Cargo.toml — thấp hơn toolchain ghim — để một tính năng ngôn ngữ mới không lọt vào mà
  # không ai biết. Chỉ `cargo check` (không test): MSRV là lời hứa "biên dịch được". Pull request không chạm Rust thì bỏ
  # qua như phần nặng của gate (`scripts/rust-changed.sh`); push main và chạy tay luôn chạy.
  msrv:
    name: MSRV build (rust-version)
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The MSRV
        id: plan
        run: echo "msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install the MSRV toolchain
        env:
          MSRV: ${{ steps.plan.outputs.msrv }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check with the MSRV
        env:
          MSRV: ${{ steps.plan.outputs.msrv }}
        # `+$MSRV` thắng `rust-toolchain.toml`. `--locked`: Cargo.lock không được đổi.
        run: cargo "+$MSRV" check --workspace --locked

  # Giấy phép bên thứ ba (D-20261126-third-party-licenses): `cargo deny check licenses` đã chạy trong gate; ở đây kiểm thêm
  # mẫu `about.hbs` / `about.toml` còn sinh được văn bản giấy phép (phát hành dựng nó), và gói SDK npm không có phụ thuộc chạy
  # (danh sách bên thứ ba của SDK rỗng).
  licenses:
    name: third-party licenses (cargo-about)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: licenses
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - run: cargo about generate --manifest-path crates/app/Cargo.toml --locked about.hbs -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"
      # Dữ liệu nhúng trong binary (danh sách mật khẩu đã lộ, MIT) phải được ghi công trong mọi bản phân phối
      # (D-20261127-breached-passwords): văn bản sinh ra phải còn mục "Bundled data".
      - name: The license file credits bundled data
        run: grep -q 'Copyright (c) 2018 Daniel Miessler' "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"
      - name: The SDK has no runtime dependencies
        run: jq -e '(.dependencies // {}) == {}' sdk/typescript/package.json

  # REUSE (REUSE.toml, LICENSES/): mọi file có thông tin bản quyền và giấy phép SPDX. Công cụ ghim phiên bản.
  reuse:
    name: REUSE compliance
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==6.3.0 lint

  # Dựng thử image (không push) khi pull request chạm thứ làm nên image (Dockerfile, about.*, toolchain, workflow phát hành):
  # `cargo auditable chef cook`, RUSTFLAGS, `cargo about` chạy lần đầu ở đây chứ không phải lúc phát hành. Kiểm thêm binary
  # có danh sách crate nhúng (`.dep-v0`) và image có văn bản giấy phép bên thứ ba. Push main: khi các file đó đổi kể từ lần
# CI xanh gần nhất trên main (job `plan`); chạy tay luôn dựng.
  image-build:
    name: image builds (no push)
    needs: plan
    if: ${{ needs.plan.outputs.image == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: autoxide:ci
          cache-from: type=gha,scope=image-test
          cache-to: type=gha,mode=max,scope=image-test
      - name: The binary lists its crates and the image carries the licenses
        run: |
          container="$(docker create autoxide:ci)"
          docker cp "$container:/usr/local/bin/autoxide" "$RUNNER_TEMP/autoxide"
          docker cp "$container:/usr/share/doc/autoxide/THIRD-PARTY-LICENSES.html" "$RUNNER_TEMP/licenses.html"
          docker rm "$container" >/dev/null
          objdump -h "$RUNNER_TEMP/autoxide" | grep -q '\.dep-v0'
          test -s "$RUNNER_TEMP/licenses.html"

  # Luật cảnh báo Prometheus (deploy/prometheus): cú pháp (`promtool check rules`) và test, kể cả ca series chưa tồn tại
  # (`promtool test rules`). `promtool` dựng từ mã nguồn ghim phiên bản (module Go v0.316.0 = Prometheus 3.16, đã ra ≥ 7 ngày;
  # go.sum kiểm bởi proxy Go) bằng Go có sẵn trên runner. Chỉ chạy khi thay đổi chạm thư mục đó (job `plan`).
  alert-rules:
    name: alert rules (promtool)
    needs: plan
    if: ${{ needs.plan.outputs.alerts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build promtool
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/prometheus/prometheus/cmd/promtool@v0.316.0
      - name: Check and test the rules
        working-directory: deploy/prometheus
        run: |
          "$RUNNER_TEMP/bin/promtool" check rules autoxide-alerts.yml
          "$RUNNER_TEMP/bin/promtool" test rules autoxide-alerts.test.yml
