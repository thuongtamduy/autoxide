# CI của Autoxide: gate đầy đủ (giống `./gate.sh` trên máy) trên PostgreSQL thấp nhất
# được hỗ trợ và mới nhất, cộng quét secret trong toàn bộ lịch sử git (D-074). `./gate.sh` trên
# máy vẫn là định nghĩa "xong" (D-173); CI là lưới thứ hai (D-175).
#
# Mọi job chỉ chạy khi repo công khai (D-197): repo riêng tư thì GitHub tính phí runner, nên
# job bị bỏ qua trước khi xin runner — không tốn phút nào.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chạy tay (Actions → Run workflow), vd sau khi đổi cài đặt của repo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (PostgreSQL ${{ matrix.postgres }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Thấp nhất được hỗ trợ (STACK.md) và mới nhất. Pull request chỉ chạy bản thấp nhất (dễ
        # hỏng nhất) để có kết quả sớm; push lên main và chạy tay thì chạy cả hai (D-20261118-public-ci-openapi-dup).
        postgres: ${{ github.event_name == 'pull_request' && fromJSON('["16"]') || fromJSON('["16", "18"]') }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Máy chủ S3 giả lập cho test lưu file (D-066).
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Database và S3 dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: `cargo xtask api-diff` so với tag phát hành gần nhất.
          fetch-depth: 0
      # Toolchain theo rust-toolchain.toml: không đối số thì rustup cài đúng bản ghim.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Service container không nhận tham số `-c` của postgres, nên cấu hình như container của
      # gate.sh (max_connections=300, bỏ fsync) bằng ALTER SYSTEM rồi khởi động lại. Mặc định 100
      # kết nối không đủ cho test chạy song song: test đỏ hàng loạt "too many clients".
      - name: Configure the PostgreSQL service like gate.sh
        run: |
          container=${{ job.services.postgres.id }}
          docker exec "$container" psql -U postgres -q \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$container" >/dev/null
          for _ in $(seq 1 30); do
            docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null && \
              docker exec "$container" psql -h 127.0.0.1 -U postgres -tAc "SHOW max_connections" && exit 0
            sleep 1
          done
          exit 1
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      # Pull request: chỉ test crate bị sửa (so với main) và crate phụ thuộc, không doc-test; push lên
      # main và chạy tay: gate đầy đủ (D-20261118-ci-pr-affected-tests).
      - run: ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }}

  sdk:
    name: TypeScript SDK and guide examples (tsc)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      # Ví dụ TypeScript của docs/guides kiểm kiểu cùng SDK (đặc tả 31 A5).
      - run: cargo xtask sdk --extract-examples sdk/typescript/examples/guides
      - name: tsc --noEmit
        working-directory: sdk/typescript
        run: npm ci && npx tsc --noEmit

  sdk-mobile:
    # Bước 69 P1 (D-20261119-step69-sdk): sinh và biên dịch SDK Swift, Kotlin, Dart từ docs/openapi.json
    # bằng công cụ ghim phiên bản. Gate không cần Swift hay JDK — nó chỉ kiểm cấu hình (`xtask sdk --check`).
    # Chỉ làm việc khi PR đổi hợp đồng API hay SDK; kiểm đường dẫn trong một bước (không dùng `paths:` ở
    # trigger) để job vẫn báo xong khi nó là check bắt buộc.
    name: Mobile SDK (${{ matrix.sdk }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [swift, kotlin, dart]
    steps:
      - uses: actions/checkout@v7
      - name: changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only FETCH_HEAD HEAD \
            | grep -qE '^(docs/openapi\.json|sdk/|Package\.swift|xtask/src/sdk_mobile\.rs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Neither the API contract nor the SDKs changed: nothing to build."
          fi
      # Swift: plugin swift-openapi-generator sinh mã lúc build từ sdk/swift/Sources/Autoxide/openapi.json.
      - name: swift build
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'swift'
        run: docker run --rm -v "$PWD:/repo" -w /repo swift:6.4.2-noble swift build
      - uses: actions/setup-java@v6
        if: steps.changed.outputs.run == 'true' && matrix.sdk != 'swift'
        with:
          distribution: temurin
          java-version: "21"
      # Phiên bản openapi-generator và tham số của từng SDK ở sdk/openapitools.json; tải jar thẳng từ
      # Maven Central (bản bọc npm dùng API tìm kiếm của Maven, hay bị giới hạn lượt gọi).
      - name: generate
        if: steps.changed.outputs.run == 'true' && matrix.sdk != 'swift'
        run: |
          config=sdk/openapitools.json
          version=$(jq -r '."generator-cli".version' "$config")
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/openapi-generator.jar" \
            "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/$version/openapi-generator-cli-$version.jar"
          generator=".\"generator-cli\".generators.${{ matrix.sdk }}"
          java -jar "$RUNNER_TEMP/openapi-generator.jar" generate \
            -g "$(jq -r "$generator.generatorName" "$config")" \
            $(jq -r "$generator.library // empty | \"--library=\" + ." "$config") \
            -i docs/openapi.json \
            -o "sdk/${{ matrix.sdk }}/generated" \
            --additional-properties="$(jq -r "$generator.additionalProperties | to_entries | map(\"\(.key)=\(.value)\") | join(\",\")" "$config")"
      # Tải và cache bản Gradle mà wrapper do generator sinh cần (tải thẳng hay quá thời gian chờ).
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'kotlin'
      - name: gradle build
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'kotlin'
        working-directory: sdk/kotlin/generated
        # Hàng trăm model: trình biên dịch Kotlin cần nhiều bộ nhớ hơn mặc định.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.compiler.execution.strategy=in-process assemble
      - uses: dart-lang/setup-dart@v1
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'dart'
        with:
          sdk: "3.14.1"
      - name: dart analyze
        if: steps.changed.outputs.run == 'true' && matrix.sdk == 'dart'
        working-directory: sdk/dart/generated
        run: |
          dart pub get
          dart run build_runner build
          dart analyze --no-fatal-warnings

  upgrade:
    # Bản phát hành trước ghi dữ liệu, bản này đọc lại trên cùng database (đặc tả 31 B1, D-246).
    # Không trong `./gate.sh`: cần tải hay build image của tag cũ.
    name: upgrade from the last release (${{ matrix.database }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Tải image của bản trước từ ghcr.io.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          # Cả lịch sử và tag: chọn tag phát hành trước HEAD.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo xtask upgrade-test --database ${{ matrix.database }}

  secrets:
    name: secret scan (gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Toàn bộ lịch sử: secret đã commit rồi xoá vẫn nằm trong git.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml
