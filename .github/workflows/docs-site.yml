# Website tài liệu có phiên bản (D-20261126-docs-site-mdbook, G13): khi tag phát hành `vX.Y.Z` được đẩy, dựng bộ tài liệu của
# đúng tag đó bằng mdBook (EN + VI) và đăng vào nhánh `gh-pages`; bản cũ giữ nguyên, `latest` trỏ bản chính thức cao nhất.
# Hai job: `build` (chỉ quyền đọc; cài và chạy công cụ bên thứ ba) → artifact → `publish` (quyền ghi; chỉ chạy script của repo,
# không cài gì). Bật GitHub Pages (Settings → Pages → nguồn: nhánh gh-pages) là việc của chủ dự án. Chạy tay
# (workflow_dispatch) với `tag` để đăng lại một tag; không `tag` thì chỉ dựng thử.
name: Docs site

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.20.0); empty = build only
        default: ""

permissions: {}

# Mỗi tag một hàng đợi: hai bản phát hành sát nhau không huỷ nhau; việc đẩy vào gh-pages tự chịu đua (script thử lại).
concurrency:
  group: docs-site-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      # Tag đi vào đường dẫn thư mục và dòng lệnh: chỉ nhận đúng dạng phiên bản.
      - name: Validate the tag
        run: |
          [ -z "$TAG" ] || [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: mdbook@0.5.4
      - name: Build the books
        run: python3 -I scripts/build-docs-site.py "${TAG:-main}" "$RUNNER_TEMP/site" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/site/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: ${{ !github.event.repository.private && (inputs.tag != '' || github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # đẩy nhánh gh-pages
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Tag đi vào đường dẫn thư mục và dòng lệnh: chỉ nhận đúng dạng phiên bản.
      - name: Validate the tag
        run: |
          [ -z "$TAG" ] || [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/site
      # Nhánh gh-pages đã có chưa (repo công khai: đọc ẩn danh không cần token).
      - name: Does gh-pages exist?
        id: pages
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY.git" gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Checkout chuẩn với persist-credentials: GITHUB_TOKEN nằm trong cấu hình git của thư mục `site` và `git push` dùng nó —
      # không có token trong URL hay dòng lệnh. Chưa có gh-pages thì lấy nhánh mặc định; script đăng tạo nhánh gh-pages rỗng.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pages.outputs.exists == 'true' && 'gh-pages' || github.event.repository.default_branch }}
          path: site
          persist-credentials: true # zizmor: ignore[artipacked] — cần để `git push` vào gh-pages; job không tải artifact lên
      - name: Publish to gh-pages
        run: scripts/publish-docs-site.sh "$TAG" "$RUNNER_TEMP/site" "$GITHUB_WORKSPACE/site"
