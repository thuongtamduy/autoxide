# Phần dùng chung của gate trên CI: lint, build test MỘT lần thành archive nextest, rồi test chia shard
# trên nhiều máy. Hai nơi gọi: `ci.yml` (pull request, push main, chạy tay) và `release.yml` (đẩy tag),
# để cả hai chạy đúng một cách chia và không lặp cấu hình (D-20261120-release-gate-sharded).
#
# Gọi bằng `uses: ./.github/workflows/gate.yml`; ngữ cảnh `github` là của workflow gọi (`event_name`,
# `ref`, `event.pull_request.title`…), nên pull request vẫn chạy `--pr`, còn push, tag và chạy tay chạy
# gate đầy đủ. Điều kiện "repo công khai" và "PR ghép lô" do workflow gọi kiểm (ở job gọi), không ở đây.
#
# Cache (Swatinem/rust-cache): chỉ main ghi (`save-if`), pull request và tag chỉ đọc (tag đọc được cache
# của nhánh mặc định). Job build test có khoá `test`; clippy build khác nên có khoá riêng.
#
# Pull request không chạm Rust (D-20261125-ci-skip-rust): bước `changed` của `lint`, `build tests` và `external module
# example` gọi `scripts/rust-changed.sh origin/<nhánh gốc>`; `false` (mọi file đã đổi nằm trong danh sách cho phép
# `scripts/rust-free-paths.txt`: tài liệu, SDK TypeScript, changelog, quyết định…) thì bỏ phần biên dịch và test nặng ở
# mức BƯỚC, như `avif` — job vẫn chạy và báo xong cùng tên, không chặn check bắt buộc (`paths:` ở trigger thì job biến
# mất). Job `tests` (các shard) bỏ qua ở mức JOB — không xin máy — khi `build tests` không build hay không test nào được
# chọn (D-20261127-ci-runner-budget). `lint` vẫn chạy phần rẻ (fmt,
# `cargo xtask check`, api-diff, `sdk --check`, cargo-deny, gitleaks), chỉ bỏ clippy và cache của nó. Push, tag và
# chạy tay luôn chạy đủ. `GATE_BASE` = nhánh gốc của PR (không phải luôn `main`), để gate.sh cùng một mốc.
name: Gate (reusable)

on:
  workflow_call:
    inputs:
      postgres-18:
        description: "Also run the tests on PostgreSQL 18 (besides the minimum supported 16)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GATE_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cả lịch sử và tag: `cargo xtask api-diff` so với tag phát hành gần nhất; gitleaks quét
          # toàn bộ lịch sử đi tới được từ HEAD (không quét nhánh khác).
          fetch-depth: 0
      # Không chạm Rust thì gate.sh tự bỏ clippy; ở đây chỉ bỏ tải cache của clippy (vài GB) — xtask tự biên dịch
      # trong ~15 giây.
      - name: changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(scripts/rust-changed.sh "$GATE_BASE")" >> "$GITHUB_OUTPUT"
          fi
      # Toolchain theo rust-toolchain.toml: không đối số thì rustup cài đúng bản ghim.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny@0.22.0
      - run: ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }} --only lint

  # Feature `avif` của `media` (không bật mặc định, D-20261121-avif-feature): clippy + test với
  # `--features avif` ở job riêng, song song, để lint không phải biên dịch bộ mã hoá AV1 (rav1e) — lint từ
  # ~5 lên ~14 phút khi gộp chung. Pull request chỉ biên dịch khi đụng `media`, danh sách thư viện hay
  # chính gate; push, tag và chạy tay luôn chạy. Job vẫn báo xong khi bỏ qua.
  avif:
    name: avif
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: changed
        id: changed
        # Giá trị từ ngữ cảnh đi qua `env:`, không chèn thẳng vào script (tên nhánh do người mở PR đặt).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          if git diff --name-only "$base" HEAD -- modules/media Cargo.lock Cargo.toml gate.sh \
            .github/workflows/gate.yml rust-toolchain.toml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Neither media nor the dependencies changed: AVIF feature not built."
          fi
      - run: rustup toolchain install
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: avif
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./gate.sh --only avif
        if: steps.changed.outputs.run == 'true'

  # Module ở repo riêng (D-20261121-external-modules): `examples/external-module` là workspace Cargo riêng —
  # một module và binary ghép nó với module chính thức — build lại cả core như người ngoài build. Job riêng,
  # song song với `build tests` (đường dài nhất của gate), nên không kéo dài gate. Test trên SQLite rồi Postgres.
  example:
    name: external module example
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Như job `build tests`: sccache giữ từng crate đã biên dịch giữa các lần chạy, mold link nhanh — job này
      # build lại cả core nên không có chúng nó thành job dài nhất của CI (D-20261122-module-helpers).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Phòng xa: server sccache chết giữa lúc biên dịch thì biên dịch lại bằng rustc thường thay vì báo lỗi.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # Database dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # So với nhánh gốc của PR (bước `changed`).
          fetch-depth: 0
      # Pull request không chạm Rust: bỏ các bước dưới, job vẫn báo xong (D-20261125-ci-skip-rust).
      - name: changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(scripts/rust-changed.sh "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"
          fi
      - run: rustup toolchain install
        if: steps.changed.outputs.run == 'true'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.changed.outputs.run == 'true'
      # Cache của GitHub Actions hết hạn mức (HTTP 503 "Egress is over the account limit") thì sccache KHÔNG khởi động
      # được, và `sccache rustc` làm hỏng cả bước build (đọc mã nguồn sccache: lỗi lúc kiểm cache khi khởi động server
      # là lỗi cứng, không có đường lui; `SCCACHE_IGNORE_SERVER_IO_ERROR` chỉ che lỗi đọc phản hồi sau khi biên dịch
      # đã bắt đầu). Nên thử khởi động trước: không được thì bỏ sccache và biên dịch thường — chậm hơn nhưng CI không chết
      # theo cache. Lỗi cache giữa chừng (đọc / ghi một crate) sccache đã tự coi là cache miss.
      - name: sccache fail-open
        if: steps.changed.outputs.run == 'true'
        run: |
          if ! sccache --start-server; then
            echo "::warning::sccache could not start (cache backend error); building without the compile cache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: example
          # Hai thư mục build: xtask ở workspace gốc, ví dụ ở workspace riêng của nó.
          workspaces: |
            . -> target
            examples/external-module -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: steps.changed.outputs.run == 'true'
      - run: ./gate.sh --only example
        if: steps.changed.outputs.run == 'true'
      - run: sccache --show-stats || true
        if: always() && steps.changed.outputs.run == 'true'

  # Build mọi chương trình test MỘT lần thành archive của nextest (`./gate.sh --only build`); các job
  # `tests` tải archive về và chạy, không biên dịch lại (D-20261120-ci-nextest-archive). Gate đầy đủ
  # (push lên main) chạy doc-test ở đây.
  build:
    name: build tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Các shard test đọc hai giá trị này: không build thì không có archive để chạy; `matrix` là các máy chạy test.
    outputs:
      run: ${{ steps.changed.outputs.run }}
      matrix: ${{ steps.shards.outputs.matrix }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # sccache (cache của GitHub Actions) cho job build tests: cache từng crate đã biên dịch, nên PR chỉ
      # biên dịch lại crate bị đổi và crate phụ thuộc. Chỉ job này: ở lint (clippy) nó làm chậm hơn. Số đo:
      # docs/BENCHMARKS.md, D-20261121-ci-sccache-build.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Phòng xa: server sccache chết giữa lúc biên dịch thì biên dịch lại bằng rustc thường thay vì báo lỗi.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      GATE_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull request so với nhánh gốc để biết crate nào bị sửa (`--pr`).
          fetch-depth: 0
      # Pull request không chạm Rust: bỏ các bước dưới, job vẫn báo xong (D-20261125-ci-skip-rust).
      - name: changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(scripts/rust-changed.sh "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"
          fi
      - run: rustup toolchain install
        if: steps.changed.outputs.run == 'true'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.changed.outputs.run == 'true'
      # Cache của GitHub Actions hết hạn mức (HTTP 503 "Egress is over the account limit") thì sccache KHÔNG khởi động
      # được, và `sccache rustc` làm hỏng cả bước build (đọc mã nguồn sccache: lỗi lúc kiểm cache khi khởi động server
      # là lỗi cứng, không có đường lui; `SCCACHE_IGNORE_SERVER_IO_ERROR` chỉ che lỗi đọc phản hồi sau khi biên dịch
      # đã bắt đầu). Nên thử khởi động trước: không được thì bỏ sccache và biên dịch thường — chậm hơn nhưng CI không chết
      # theo cache. Lỗi cache giữa chừng (đọc / ghi một crate) sccache đã tự coi là cache miss.
      - name: sccache fail-open
        if: steps.changed.outputs.run == 'true'
        run: |
          if ! sccache --start-server; then
            echo "::warning::sccache could not start (cache backend error); building without the compile cache"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.152
      # mold thay linker mặc định (ld) của máy CI: job này link hàng chục chương trình test lớn, mold
      # link nhanh hơn nhiều. Chỉ đổi linker hệ thống (không đổi RUSTFLAGS) nên cache sccache /
      # rust-cache giữ nguyên khoá; file chạy ra vẫn là ELF thường cho máy test (D-20261121-ci-mold-shards).
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: steps.changed.outputs.run == 'true'
      - run: ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }} --only build
        if: steps.changed.outputs.run == 'true'
      - run: sccache --show-stats || true
        if: always() && steps.changed.outputs.run == 'true'
      # Số máy chạy test (D-20261127-ci-runner-budget): gate đầy đủ chia cố định (SQLite 4, Postgres 6 mỗi bản); pull
      # request chia theo chi phí ước lượng của các test được chọn (`tests.json` do `gate.sh --pr --only build` ghi), tối
      # đa như gate đầy đủ — PR chạm vài crate không giữ 10 máy. `[]` (job `tests` bỏ qua) chỉ khi filterset là `none()`;
      # JSON lạ hay 0 test khớp một filterset khác thì bước này đỏ (fail-closed).
      # Chỉ đổi số máy; `--partition count:k/n` của nextest vẫn chạy đủ mọi test đã chọn.
      - name: test shards
        id: shards
        if: steps.changed.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          POSTGRES_18: ${{ inputs.postgres-18 }}
        run: |
          args=()
          [ "$EVENT_NAME" = pull_request ] && args+=(--tests target/gate-archive/tests.json --filter target/gate-archive/filter)
          [ "$POSTGRES_18" = true ] && args+=(--postgres-18)
          matrix="$(cargo xtask test-shards "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.[].name'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changed.outputs.run == 'true'
        with:
          name: test-archive
          path: target/gate-archive
          if-no-files-found: error
          retention-days: 1
          # Archive đã nén zstd.
          compression-level: 0

  tests:
    name: ${{ matrix.target.name }}
    needs: build
    # Pull request không chạm Rust (`build tests` bỏ qua) hay không test nào được chọn: không xin máy nào. Job bị bỏ
    # qua được tính là đạt; job gộp `gate (PostgreSQL …)` của ci.yml vẫn đỏ khi một shard đỏ (D-20261127-ci-runner-budget).
    if: ${{ needs.build.outputs.run == 'true' && needs.build.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `part`: phần của `./gate.sh --only`; `shard`: phần của `./gate.sh --shard` (nextest
        # `--partition count:k/n`). Không build nên chia thêm máy rẻ: mỗi máy chỉ tải archive rồi chạy.
        # Danh sách do `cargo xtask test-shards` ở job `build tests` lập (xem `xtask/src/test_shards.rs`): gate đầy đủ
        # chia SQLite 4 phần, Postgres 6 phần (Postgres chậm hơn — mỗi test một database thật — nên nhiều phần hơn,
        # D-20261121-ci-mold-shards); pull request chia theo các test được chọn, không quá số đó.
        # Postgres thấp nhất được hỗ trợ (STACK.md) và mới nhất: `postgres-18` tắt thì chỉ chạy bản thấp
        # nhất (dễ hỏng nhất) để có kết quả sớm — pull request và phát hành; push lên main và chạy tay
        # thì chạy cả hai (D-20261118-public-ci-openapi-dup).
        target: ${{ fromJSON(needs.build.outputs.matrix) }}
    services:
      # Job SQLite cũng có service Postgres (khởi động song song với checkout, không tốn thời gian)
      # cho matrix khỏi rẽ nhánh; nó không dùng tới.
      postgres:
        image: ${{ matrix.target.postgres == '18' && 'postgres:18-alpine' || 'postgres:16-alpine' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Máy chủ S3 giả lập cho test lưu file (D-066).
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_TERM_COLOR: always
      # Database và S3 dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      # Mã nguồn cùng commit với archive: test đọc file của repo (bản dịch, docs/openapi.json…).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Không cài toolchain Rust: archive đã build, `gate.sh --archive` gọi thẳng `cargo-nextest`.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest@0.9.152
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-archive
          path: target/gate-archive
      # Service container không nhận tham số `-c` của postgres, nên cấu hình như container của
      # gate.sh (max_connections=300, bỏ fsync) bằng ALTER SYSTEM rồi khởi động lại. Mặc định 100
      # kết nối không đủ cho test chạy song song: test đỏ hàng loạt "too many clients".
      - name: Configure the PostgreSQL service like gate.sh
        if: ${{ matrix.target.part == 'postgres' }}
        # Giá trị từ ngữ cảnh đi qua `env:`, không chèn thẳng vào script (zizmor `template-injection`).
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          container="$CONTAINER"
          docker exec "$container" psql -U postgres -q \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$container" >/dev/null
          for _ in $(seq 1 30); do
            docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null && \
              docker exec "$container" psql -h 127.0.0.1 -U postgres -tAc "SHOW max_connections" && exit 0
            sleep 1
          done
          exit 1
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      # Pull request: chỉ test crate bị sửa (so với main) và crate phụ thuộc (file `filter` trong
      # archive); push lên main và chạy tay: mọi test (D-20261118-ci-pr-affected-tests).
      - env:
          PR_FLAG: ${{ github.event_name == 'pull_request' && '--pr' || '' }}
          PART: ${{ matrix.target.part }}
          SHARD: ${{ matrix.target.shard }}
        run: |
          flags=()
          [ -n "$PR_FLAG" ] && flags+=("$PR_FLAG")
          ./gate.sh "${flags[@]}" --only "$PART" --archive target/gate-archive --shard "$SHARD"
