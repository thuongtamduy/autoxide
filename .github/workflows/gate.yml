# Phần dùng chung của gate trên CI: lint, build test MỘT lần thành archive nextest, rồi test chia shard
# trên nhiều máy. Hai nơi gọi: `ci.yml` (pull request, push main, chạy tay) và `release.yml` (đẩy tag),
# để cả hai chạy đúng một cách chia và không lặp cấu hình (D-20261120-release-gate-sharded).
#
# Gọi bằng `uses: ./.github/workflows/gate.yml`; ngữ cảnh `github` là của workflow gọi (`event_name`,
# `ref`, `event.pull_request.title`…), nên pull request vẫn chạy `--pr`, còn push, tag và chạy tay chạy
# gate đầy đủ. Điều kiện "repo công khai" và "PR ghép lô" do workflow gọi kiểm (ở job gọi), không ở đây.
#
# Cache (Swatinem/rust-cache): chỉ main ghi (`save-if`), pull request và tag chỉ đọc (tag đọc được cache
# của nhánh mặc định). Job build test có khoá `test`; clippy build khác nên có khoá riêng.
name: Gate (reusable)

on:
  workflow_call:
    inputs:
      postgres-18:
        description: "Also run the tests on PostgreSQL 18 (besides the minimum supported 16)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cả lịch sử và tag: `cargo xtask api-diff` so với tag phát hành gần nhất; gitleaks quét
          # toàn bộ lịch sử.
          fetch-depth: 0
      # Toolchain theo rust-toolchain.toml: không đối số thì rustup cài đúng bản ghim.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny@0.22.0
      - run: ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }} --only lint

  # Feature `avif` của `media` (không bật mặc định, D-20261121-avif-feature): clippy + test với
  # `--features avif` ở job riêng, song song, để lint không phải biên dịch bộ mã hoá AV1 (rav1e) — lint từ
  # ~5 lên ~14 phút khi gộp chung. Pull request chỉ biên dịch khi đụng `media`, danh sách thư viện hay
  # chính gate; push, tag và chạy tay luôn chạy. Job vẫn báo xong khi bỏ qua.
  avif:
    name: avif
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: changed
        id: changed
        # Giá trị từ ngữ cảnh đi qua `env:`, không chèn thẳng vào script (tên nhánh do người mở PR đặt).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          if git diff --name-only "$base" HEAD -- modules/media Cargo.lock Cargo.toml gate.sh \
            .github/workflows/gate.yml rust-toolchain.toml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Neither media nor the dependencies changed: AVIF feature not built."
          fi
      - run: rustup toolchain install
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: avif
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./gate.sh --only avif
        if: steps.changed.outputs.run == 'true'

  # Module ở repo riêng (D-20261121-external-modules): `examples/external-module` là workspace Cargo riêng —
  # một module và binary ghép nó với module chính thức — build lại cả core như người ngoài build. Job riêng,
  # song song với `build tests` (đường dài nhất của gate), nên không kéo dài gate. Test trên SQLite rồi Postgres.
  example:
    name: external module example
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # Database dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: example
          # Hai thư mục build: xtask ở workspace gốc, ví dụ ở workspace riêng của nó.
          workspaces: |
            . -> target
            examples/external-module -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./gate.sh --only example

  # Build mọi chương trình test MỘT lần thành archive của nextest (`./gate.sh --only build`); các job
  # `tests` tải archive về và chạy, không biên dịch lại (D-20261120-ci-nextest-archive). Gate đầy đủ
  # (push lên main) chạy doc-test ở đây.
  build:
    name: build tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # sccache (cache của GitHub Actions) cho job build tests: cache từng crate đã biên dịch, nên PR chỉ
      # biên dịch lại crate bị đổi và crate phụ thuộc. Chỉ job này: ở lint (clippy) nó làm chậm hơn. Số đo:
      # docs/BENCHMARKS.md, D-20261121-ci-sccache-build.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull request so với origin/main để biết crate nào bị sửa (`--pr`).
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest@0.9.152
      # mold thay linker mặc định (ld) của máy CI: job này link hàng chục chương trình test lớn, mold
      # link nhanh hơn nhiều. Chỉ đổi linker hệ thống (không đổi RUSTFLAGS) nên cache sccache /
      # rust-cache giữ nguyên khoá; file chạy ra vẫn là ELF thường cho máy test (D-20261121-ci-mold-shards).
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - run: ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }} --only build
      - run: sccache --show-stats
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-archive
          path: target/gate-archive
          if-no-files-found: error
          retention-days: 1
          # Archive đã nén zstd.
          compression-level: 0

  tests:
    name: ${{ matrix.target.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `part`: phần của `./gate.sh --only`; `shard`: phần của `./gate.sh --shard` (nextest
        # `--partition count:k/n`). Không build nên chia thêm máy rẻ: mỗi máy chỉ tải archive rồi chạy.
        # Postgres chậm hơn SQLite (mỗi test một database thật) nên chia 6 phần, SQLite 4: hai nhóm xong
        # gần cùng lúc (D-20261121-ci-mold-shards).
        # Postgres thấp nhất được hỗ trợ (STACK.md) và mới nhất: `postgres-18` tắt thì chỉ chạy bản thấp
        # nhất (dễ hỏng nhất) để có kết quả sớm — pull request và phát hành; push lên main và chạy tay
        # thì chạy cả hai (D-20261118-public-ci-openapi-dup).
        target: >-
          ${{ fromJSON(inputs.postgres-18 && '[
            {"name": "sqlite 1/4", "part": "sqlite", "shard": "1/4", "postgres": "16"},
            {"name": "sqlite 2/4", "part": "sqlite", "shard": "2/4", "postgres": "16"},
            {"name": "sqlite 3/4", "part": "sqlite", "shard": "3/4", "postgres": "16"},
            {"name": "sqlite 4/4", "part": "sqlite", "shard": "4/4", "postgres": "16"},
            {"name": "postgres 16 1/6", "part": "postgres", "shard": "1/6", "postgres": "16"},
            {"name": "postgres 16 2/6", "part": "postgres", "shard": "2/6", "postgres": "16"},
            {"name": "postgres 16 3/6", "part": "postgres", "shard": "3/6", "postgres": "16"},
            {"name": "postgres 16 4/6", "part": "postgres", "shard": "4/6", "postgres": "16"},
            {"name": "postgres 16 5/6", "part": "postgres", "shard": "5/6", "postgres": "16"},
            {"name": "postgres 16 6/6", "part": "postgres", "shard": "6/6", "postgres": "16"},
            {"name": "postgres 18 1/6", "part": "postgres", "shard": "1/6", "postgres": "18"},
            {"name": "postgres 18 2/6", "part": "postgres", "shard": "2/6", "postgres": "18"},
            {"name": "postgres 18 3/6", "part": "postgres", "shard": "3/6", "postgres": "18"},
            {"name": "postgres 18 4/6", "part": "postgres", "shard": "4/6", "postgres": "18"},
            {"name": "postgres 18 5/6", "part": "postgres", "shard": "5/6", "postgres": "18"},
            {"name": "postgres 18 6/6", "part": "postgres", "shard": "6/6", "postgres": "18"}
          ]' || '[
            {"name": "sqlite 1/4", "part": "sqlite", "shard": "1/4", "postgres": "16"},
            {"name": "sqlite 2/4", "part": "sqlite", "shard": "2/4", "postgres": "16"},
            {"name": "sqlite 3/4", "part": "sqlite", "shard": "3/4", "postgres": "16"},
            {"name": "sqlite 4/4", "part": "sqlite", "shard": "4/4", "postgres": "16"},
            {"name": "postgres 16 1/6", "part": "postgres", "shard": "1/6", "postgres": "16"},
            {"name": "postgres 16 2/6", "part": "postgres", "shard": "2/6", "postgres": "16"},
            {"name": "postgres 16 3/6", "part": "postgres", "shard": "3/6", "postgres": "16"},
            {"name": "postgres 16 4/6", "part": "postgres", "shard": "4/6", "postgres": "16"},
            {"name": "postgres 16 5/6", "part": "postgres", "shard": "5/6", "postgres": "16"},
            {"name": "postgres 16 6/6", "part": "postgres", "shard": "6/6", "postgres": "16"}
          ]') }}
    services:
      # Job SQLite cũng có service Postgres (khởi động song song với checkout, không tốn thời gian)
      # cho matrix khỏi rẽ nhánh; nó không dùng tới.
      postgres:
        image: postgres:${{ matrix.target.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Máy chủ S3 giả lập cho test lưu file (D-066).
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_TERM_COLOR: always
      # Database và S3 dùng xong bỏ của CI: mật khẩu này không bảo vệ gì.
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      # Mã nguồn cùng commit với archive: test đọc file của repo (bản dịch, docs/openapi.json…).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Không cài toolchain Rust: archive đã build, `gate.sh --archive` gọi thẳng `cargo-nextest`.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest@0.9.152
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-archive
          path: target/gate-archive
      # Service container không nhận tham số `-c` của postgres, nên cấu hình như container của
      # gate.sh (max_connections=300, bỏ fsync) bằng ALTER SYSTEM rồi khởi động lại. Mặc định 100
      # kết nối không đủ cho test chạy song song: test đỏ hàng loạt "too many clients".
      - name: Configure the PostgreSQL service like gate.sh
        if: ${{ matrix.target.part == 'postgres' }}
        run: |
          container=${{ job.services.postgres.id }}
          docker exec "$container" psql -U postgres -q \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$container" >/dev/null
          for _ in $(seq 1 30); do
            docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null && \
              docker exec "$container" psql -h 127.0.0.1 -U postgres -tAc "SHOW max_connections" && exit 0
            sleep 1
          done
          exit 1
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      # Pull request: chỉ test crate bị sửa (so với main) và crate phụ thuộc (file `filter` trong
      # archive); push lên main và chạy tay: mọi test (D-20261118-ci-pr-affected-tests).
      - run: >-
          ./gate.sh ${{ github.event_name == 'pull_request' && '--pr' || '' }}
          --only ${{ matrix.target.part }} --archive target/gate-archive
          --shard ${{ matrix.target.shard }}
