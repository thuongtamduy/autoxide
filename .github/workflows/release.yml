# Phát hành khi đẩy tag `vX.Y.Z` hay khi auto-release.yml gọi trên tag (D-078, D-175, D-20261121-auto-release): kiểm tag khớp phiên bản trong Cargo.toml, chạy
# lại gate (chia nhiều máy, dùng chung gate.yml với ci.yml), build image Docker cho `linux/amd64` và `linux/arm64` trên máy build gốc của GitHub
# (không giả lập), đăng lên GitHub Container Registry bằng `GITHUB_TOKEN`, đính kèm chứng thực
# nguồn gốc build và SBOM đã ký, rồi tạo bản phát hành GitHub với ghi chú lấy từ CHANGELOG.md.
# Ký không cần khoá giữ tay (D-20261123-supply-chain): image và mọi file đính kèm (binary Linux, gói SDK, SBOM) có
# chứng thực nguồn gốc build (SLSA) ký bằng Sigstore qua OIDC của GitHub Actions; image còn có chữ ký cosign, file
# có `SHA256SUMS` ký bằng cosign. Cách kiểm: docs/VERIFYING.md. Bản thử `X.Y.Z-rc.N` là pre-release:
# không gắn image `latest` / `X.Y`, không thành "Latest release" trên GitHub (docs/RELEASING.md, "Bản thử").
# Quy trình: docs/RELEASING.md. Chỉ chạy khi repo công khai (D-197). Tag đã có mà thiếu image: workflow
# release-image.yml (D-20261120-upgrade-image); tên và thẻ image ở hai file phải giống nhau (test của xtask kiểm).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Chạy lại bằng tay trên một tag `vX.Y.Z` (Actions → Run workflow → chọn tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Kiểm riêng của phát hành: tag khớp `version` trong Cargo.toml và CHANGELOG.md có mục của bản này.
  # Chạy trước, vài giây, để tag sai không tốn một lần gate.
  verify:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
      latest: ${{ steps.kind.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section [$version]" >&2; exit 1; }
      # Bản thử (`X.Y.Z-rc.N`) là pre-release: không bao giờ là `latest`. Bản chính thức chỉ là `latest` khi nó là bản
      # chính thức cao nhất đã có (bản vá của dòng cũ, nhánh `release/X.Y`, không giành `latest` của dòng mới).
      - id: kind
        name: Pre-release or stable, and whether it becomes latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "Pre-release $version must look like X.Y.Z-rc.N (docs/RELEASING.md)" >&2
              exit 1
            fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$version is a release candidate: pre-release, not latest."
            exit 0
          fi
          # Repo công khai (workflow chỉ chạy khi đó) nên đọc tag không cần token.
          highest="$(
            { git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##'; echo "$version"; } \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          )"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          if [ "$highest" = "$version" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "$version is the highest stable release: latest."
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$version is older than $highest (a patch for an older line): not latest."
          fi

  # Dùng lại kết quả CI của đúng commit (D-20261121-ci-batch-release-faster): nếu workflow CI trên `main` của
  # ĐÚNG SHA của tag đã `success` (gate SQLite + PostgreSQL 16 và 18, upgrade-test, quét secret — đúng thứ D-300
  # đòi trước khi phát hành) thì không chạy lại gate. Chưa có lần chạy, đang chạy hay đỏ thì `reuse=false`
  # và job `gate` bên dưới chạy như cũ. Chạy lại bằng tay (workflow_dispatch) cũng kiểm theo SHA của tag đã chọn.
  ci-result:
    needs: verify
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Lần chạy của ci.yml do push vào `main` trên đúng commit này; lấy lần mới nhất.
          result="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f event=push -f branch=main -f per_page=1 \
            --jq '.workflow_runs[0] | "\(.status // "none") \(.conclusion // "none") \(.html_url // "")"' || true)"
          echo "CI on main for $SHA: ${result:-none}"
          case "$result" in
            "completed success "*)
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "CI on main already passed the full gate for this commit: skipping the gate here." ;;
            *)
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "No green CI run on main for this commit: running the gate." ;;
          esac

  # Gate đầy đủ chia nhiều máy, dùng chung với ci.yml (build archive một lần rồi 8 shard; D-20261120-release-gate-sharded).
  # Chỉ chạy khi CI trên `main` chưa xanh cho đúng commit này. PostgreSQL 16 như trước: bản 18 đã chạy ở lần
  # push lên main của cùng commit.
  gate:
    needs: [verify, ci-result]
    if: ${{ !github.event.repository.private && needs.ci-result.outputs.reuse != 'true' }}
    uses: ./.github/workflows/gate.yml
    with:
      postgres-18: false

  # Mỗi kiến trúc build trên máy cùng kiến trúc, đẩy image theo digest (chưa có tag); job
  # `publish` ghép các digest thành một image đa nền tảng.
  image:
    needs: [verify, gate]
    # Gate bị bỏ qua (CI trên main đã xanh) thì vẫn build; gate đỏ hay bị huỷ thì không.
    if: ${{ !cancelled() && needs.verify.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.gate.result) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # Máy build ARM của GitHub: miễn phí cho repo công khai (D-078 để sau vì giả lập quá lâu).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tên image trên ghcr.io phải viết thường; tên chủ repo có thể có chữ hoa.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build tái lập (docs/COMPATIBILITY.md): mọi mốc thời gian của image và file nén lấy từ thời điểm commit của tag.
      - name: SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # Chứng thực của BuildKit nằm cùng image: SBOM và nguồn gốc build đầy đủ.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
      # Binary Linux đính kèm bản phát hành: lấy đúng file trong image vừa build (cùng mã, cùng lần build), không build
      # lại. Build trên Debian 13 nên cần glibc đủ mới (docs/VERIFYING.md); không chạy thử ở đây vì máy
      # build (Ubuntu 24.04) có thể có glibc cũ hơn.
      - name: Binary from the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          name="autoxide-${TAG#v}-$TARGET"
          mkdir -p "dist/$name"
          container="$(docker create --platform "$PLATFORM" "$IMAGE@$DIGEST")"
          docker cp "$container:/usr/local/bin/autoxide" "dist/$name/autoxide"
          docker cp "$container:/usr/share/doc/autoxide/THIRD-PARTY-LICENSES.html" "dist/$name/THIRD-PARTY-LICENSES.html"
          docker rm "$container" >/dev/null
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          file "dist/$name/autoxide"
          # Cùng thư mục cho cùng byte: xếp theo tên, chủ sở hữu và mốc thời gian cố định, gzip không ghi tên/giờ.
          touch -d "@$SOURCE_DATE_EPOCH" "dist/$name"/*
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -cf - "$name" \
            | gzip -n > "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ strategy.job-index }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # SBOM các crate Rust (CycloneDX 1.5) sinh từ Cargo.lock cho binary `autoxide` — NGOÀI job `publish`: cài `cargo-cyclonedx`
  # chạy mã bên thứ ba (kể cả build script), nên job này chỉ có quyền đọc, không token OIDC, không quyền ghi hay ký; kết
  # quả đi sang `publish` bằng artifact (được ký ở đó như mọi file phát hành). Danh sách nhúng trong binary do
  # `cargo auditable` (Dockerfile) lo riêng. Công cụ ghim phiên bản (đã ra ≥ 7 ngày), `--locked`.
  sbom:
    needs: verify
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install cargo-cyclonedx --locked --version 0.5.10
      # `cargo cyclonedx` sinh một file mỗi crate của workspace; lấy file của crate `autoxide` (mọi phụ thuộc của binary).
      - run: |
          cargo cyclonedx --manifest-path crates/app/Cargo.toml --format json --spec-version 1.5 \
            --override-filename autoxide.cdx
          mkdir sbom
          cp crates/app/autoxide.cdx.json sbom/autoxide.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom/autoxide.cdx.json
          if-no-files-found: error
          retention-days: 1
      # Văn bản giấy phép của các crate trong binary, cho archive macOS/Windows (build bằng cargo trực tiếp, không qua Docker
      # nên không có file này như archive Linux). MIT/Apache buộc kèm thông báo giấy phép trong mọi bản phân phối binary.
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - run: |
          mkdir licenses
          cargo about generate --manifest-path crates/app/Cargo.toml --locked about.hbs -o licenses/THIRD-PARTY-LICENSES.html
          test -s licenses/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: licenses/THIRD-PARTY-LICENSES.html
          if-no-files-found: error
          retention-days: 1

  # Binary macOS và Windows (G6, D-20261126-demo-and-native-binaries): người không dùng Docker hay Rust tải về chạy. Build bằng
  # toolchain đã ghim trên máy runner của từng hệ điều hành (không giả lập). Không chặn phát hành: một nền tảng hỏng thì
  # bản phát hành vẫn ra với các file còn lại (job `publish` chỉ cần `image` xanh, và đính kèm những gì đã có).
  # Chưa ký bằng khoá của Apple hay Microsoft (cần chứng chỉ trả phí của chủ dự án): chứng thực SLSA và `SHA256SUMS`
  # ký bằng cosign vẫn có, cách kiểm ở docs/VERIFYING.md; cách mở file chưa ký ở docs/GETTING-STARTED.md.
  native:
    # `sbom` cho văn bản giấy phép bên thứ ba đóng vào archive; thiếu nó thì archive native không được tạo (bản phân phối binary
    # không kèm thông báo giấy phép là không hợp lệ).
    needs: [verify, gate, sbom]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.sbom.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.gate.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses
      # `rust-toolchain.toml` ghim phiên bản; rustup tải đúng bản và mục tiêu của máy này.
      - name: Build the binary
        shell: bash
        run: cargo build --release --locked -p autoxide
      - name: Pack
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="autoxide-${TAG#v}-$TARGET"
          mkdir -p "dist/$name"
          exe=autoxide
          if [ "$ARCHIVE" = zip ]; then exe=autoxide.exe; fi
          cp "target/release/$exe" "dist/$name/$exe"
          cp LICENSE-MIT LICENSE-APACHE README.md licenses/THIRD-PARTY-LICENSES.html "dist/$name/"
          # Chạy thử ngay trên máy build: binary không khởi động được thì không đính kèm.
          "dist/$name/$exe" --version
          if [ "$ARCHIVE" = zip ]; then
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, image, sbom, native]
    # Điều kiện mặc định (`success()`) bỏ qua job khi BẤT KỲ job nào phía trên trong chuỗi `needs` bị bỏ qua — kể cả
    # `gate` bị bỏ qua có chủ đích khi dùng lại CI xanh (D-20261121-ci-batch-release-faster). v0.17.0 dính lỗi này:
    # image build xong nhưng không gắn thẻ, không cập nhật trang Release. Chỉ cần `image` xanh.
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Ký chứng thực (Sigstore qua OIDC) và lưu nó vào GitHub.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      # Binary của hai kiến trúc vào `dist/`: mọi file đính kèm bản phát hành nằm ở đó để băm, ký và chứng thực chung.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-cyclonedx
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `{{major}}.{{minor}}` không áp cho bản thử (`docker/metadata-action` chỉ gắn `{{version}}` cho pre-release);
      # `latest` do job `verify` quyết (không bao giờ cho bản thử, không cho bản vá dòng cũ).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ needs.verify.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-platform image with its tags
        working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - id: index
        name: Digest of the multi-platform image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Chứng thực nguồn gốc build (SLSA), ký và lưu ở GitHub lẫn registry:
      # `gh attestation verify oci://ghcr.io/<owner>/autoxide:X.Y.Z --owner <owner>`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      # Chữ ký cosign không khoá (keyless) cho image, cho người dùng `cosign verify` thay vì `gh attestation verify`:
      # chứng chỉ ngắn hạn của Sigstore cấp theo danh tính OIDC của đúng workflow này, không có khoá nào phải giữ.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the image with cosign (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # Danh sách thành phần (SPDX) của image, cũng ký thành chứng thực và đính vào bản phát hành.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: dist/sbom.spdx.json
          push-to-registry: true
      # Văn bản giấy phép bên thứ ba (D-20261126-third-party-licenses): lấy từ tarball đã build, đính riêng vào trang Release.
      - name: Third-party licenses
        run: |
          tar -xzf dist/autoxide-*-x86_64-unknown-linux-gnu.tar.gz -O --wildcards '*/THIRD-PARTY-LICENSES.html' \
            > dist/THIRD-PARTY-LICENSES.html
          test -s dist/THIRD-PARTY-LICENSES.html
      # Mọi archive binary (Linux, macOS, Windows) phải mang văn bản giấy phép bên thứ ba: thiếu ở một archive thì không phát hành.
      - name: Every binary archive carries the license texts
        run: |
          shopt -s nullglob
          for archive in dist/*.tar.gz; do
            tar -tzf "$archive" | grep -q '/THIRD-PARTY-LICENSES.html$' || { echo "::error::$archive has no THIRD-PARTY-LICENSES.html"; exit 1; }
          done
          for archive in dist/*.zip; do
            unzip -l "$archive" | grep -q '/THIRD-PARTY-LICENSES.html$' || { echo "::error::$archive has no THIRD-PARTY-LICENSES.html"; exit 1; }
          done
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          version="${TAG#v}"
          {
            if [ "$PRERELEASE" = true ]; then
              echo "> **Release candidate** of ${version%%-*}, for testing before the final release: do not use it in"
              echo "> production. Report problems as issues (security problems: SECURITY.md)."
              echo
            fi
            awk -v section="## [$version]" '
              index($0, section) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          } > notes.md
          # GitHub giới hạn ghi chú một bản phát hành ở 125 000 ký tự (v0.15.0 vượt). Dài hơn thì thay
          # bằng đoạn ngắn dẫn tới mục của bản này trong CHANGELOG.md của tag.
          if [ "$(wc -c < notes.md)" -gt 120000 ]; then
            anchor="$(printf '%s' "$version" | tr -d '.')"
            released="$(grep -m1 "^## \\[$version\\]" CHANGELOG.md | sed 's/.* - //')"
            {
              echo "Docker image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$version\` (linux/amd64, linux/arm64)."
              echo
              echo "The list of changes is too long for this page; see"
              echo "[CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md#${anchor}---${released})."
            } > notes.md
          fi
      # Gói SDK TypeScript đính kèm bản phát hành: client cài bằng URL của file, không cần npm registry (D-177).
      - name: Pack the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          # Giấy phép của chính SDK đi kèm gói (SDK không có phụ thuộc chạy, nên không có giấy phép bên thứ ba).
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          npm pack
          mv autoxide-sdk-*.tgz ../../dist/
      # Mọi file đính kèm: một `SHA256SUMS` ký bằng cosign (bundle Sigstore), và chứng thực nguồn gốc build (SLSA) cho
      # từng file, lưu ở GitHub: `gh attestation verify <file> --repo <owner>/autoxide`.
      - name: Checksums of the release files
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum -- *.tar.gz *.zip *.tgz sbom.spdx.json autoxide.cdx.json THIRD-PARTY-LICENSES.html > SHA256SUMS
          cat SHA256SUMS
      # Danh sách file cần chứng thực dựng ở đây, không bằng mẫu `dist/*.zip` trong `subject-path`: một nền tảng native hỏng
      # thì mẫu đó không khớp file nào và không biết `actions/attest` xử lý ra sao. Thiếu nền tảng thì ghi cảnh báo và thêm một
      # dòng vào ghi chú phát hành, để người đọc trang Release biết vì sao thiếu file.
      - id: subjects
        name: Files to attest, and platforms missing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          version="${TAG#v}"
          missing=()
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            if ! compgen -G "dist/autoxide-$version-$target.*" >/dev/null; then missing+=("$target"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::No binary for: ${missing[*]} (the native build failed or was skipped)"
            {
              echo
              echo "> No binary was built for: ${missing[*]}. Use the Docker image or build from source."
            } >> notes.md
          fi
          {
            echo "paths<<EOF"
            printf '%s\n' dist/*.tar.gz dist/*.zip dist/*.tgz dist/sbom.spdx.json dist/autoxide.cdx.json dist/THIRD-PARTY-LICENSES.html
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}
      - name: Sign the checksums with cosign (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Create the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          sdk="$(ls autoxide-sdk-*.tgz)"
          files=(
            "sbom.spdx.json#SBOM (SPDX JSON) of the Docker image"
            "autoxide.cdx.json#SBOM (CycloneDX JSON) of the Rust crates in the binary"
            "THIRD-PARTY-LICENSES.html#License texts of the third-party Rust crates in the binary"
            "$sdk#TypeScript SDK (npm install <URL of this file>)"
            "SHA256SUMS#SHA-256 checksums of the release files"
            "SHA256SUMS.sigstore.json#Sigstore bundle: cosign signature of SHA256SUMS"
          )
          # Linux (từ image) luôn có; macOS và Windows chỉ khi job `native` của nền tảng đó xanh.
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            files+=("autoxide-${TAG#v}-$target.tar.gz#Linux binary ($target)")
          done
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            file="autoxide-${TAG#v}-$target.tar.gz"
            if [ -f "$file" ]; then files+=("$file#macOS binary ($target, not notarized)"); fi
          done
          file="autoxide-${TAG#v}-x86_64-pc-windows-msvc.zip"
          if [ -f "$file" ]; then files+=("$file#Windows binary (x86_64-pc-windows-msvc, not signed)"); fi
          # Bản thử là pre-release và không bao giờ là "Latest release"; bản vá dòng cũ cũng không (job `verify`).
          flags=("--prerelease=$PRERELEASE" "--latest=$LATEST")
          # Chủ dự án có thể đã tạo trang Release để có tag (agent không đẩy được tag): khi đó cập nhật
          # trang đó và đính kèm file, thay vì báo "already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Autoxide $TAG" --notes-file ../notes.md "${flags[@]}"
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" --title "Autoxide $TAG" --notes-file ../notes.md --verify-tag "${flags[@]}" \
              "${files[@]}"
          fi
