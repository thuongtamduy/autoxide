# Phát hành khi đẩy tag `vX.Y.Z` (D-078): kiểm tag khớp phiên bản trong Cargo.toml, chạy
# lại gate, build và đăng image Docker lên GitHub Container Registry, tạo bản phát hành
# GitHub với ghi chú lấy từ CHANGELOG.md. Quy trình: docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_INCREMENTAL: "0"
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section [$version]" >&2; exit 1; }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      - run: ./gate.sh

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v section="## [$version]" '
            index($0, section) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "Autoxide $TAG" --notes-file notes.md --verify-tag
