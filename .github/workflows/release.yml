# Phát hành khi đẩy tag `vX.Y.Z` (D-078, D-175): kiểm tag khớp phiên bản trong Cargo.toml, chạy
# lại gate, build image Docker cho `linux/amd64` và `linux/arm64` trên máy build gốc của GitHub
# (không giả lập), đăng lên GitHub Container Registry bằng `GITHUB_TOKEN`, đính kèm chứng thực
# nguồn gốc build và SBOM đã ký, rồi tạo bản phát hành GitHub với ghi chú lấy từ CHANGELOG.md.
# Quy trình: docs/RELEASING.md. Chỉ chạy khi repo công khai (D-197).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Chạy lại bằng tay trên một tag `vX.Y.Z` (Actions → Run workflow → chọn tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    env:
      CARGO_INCREMENTAL: "0"
      GATE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GATE_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section [$version]" >&2; exit 1; }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Create the S3 test bucket
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --request PUT "$GATE_S3_ENDPOINT/autoxide-test" && exit 0
            sleep 1
          done
          exit 1
      - run: ./gate.sh

  # Mỗi kiến trúc build trên máy cùng kiến trúc, đẩy image theo digest (chưa có tag); job
  # `publish` ghép các digest thành một image đa nền tảng.
  image:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          # Máy build ARM của GitHub: miễn phí cho repo công khai (D-078 để sau vì giả lập quá lâu).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Tên image trên ghcr.io phải viết thường; tên chủ repo có thể có chữ hoa.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Chứng thực của BuildKit nằm cùng image: SBOM và nguồn gốc build đầy đủ.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Ký chứng thực (Sigstore qua OIDC) và lưu nó vào GitHub.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-platform image with its tags
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: index
        name: Digest of the multi-platform image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Chứng thực nguồn gốc build (SLSA), ký và lưu ở GitHub lẫn registry:
      # `gh attestation verify oci://ghcr.io/<owner>/autoxide:X.Y.Z --owner <owner>`.
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      # Danh sách thành phần (SPDX) của image, cũng ký thành chứng thực và đính vào bản phát hành.
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v section="## [$version]" '
            index($0, section) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "Autoxide $TAG" --notes-file notes.md --verify-tag \
            "sbom.spdx.json#SBOM (SPDX JSON) of the Docker image"
