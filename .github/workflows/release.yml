# Phát hành khi đẩy tag `vX.Y.Z` hay khi auto-release.yml gọi trên tag (D-078, D-175, D-20261121-auto-release): kiểm tag khớp phiên bản trong Cargo.toml, chạy
# lại gate (chia nhiều máy, dùng chung gate.yml với ci.yml), build image Docker cho `linux/amd64` và `linux/arm64` trên máy build gốc của GitHub
# (không giả lập), đăng lên GitHub Container Registry bằng `GITHUB_TOKEN`, đính kèm chứng thực
# nguồn gốc build và SBOM đã ký, rồi tạo bản phát hành GitHub với ghi chú lấy từ CHANGELOG.md.
# Quy trình: docs/RELEASING.md. Chỉ chạy khi repo công khai (D-197). Tag đã có mà thiếu image: workflow
# release-image.yml (D-20261120-upgrade-image); tên và thẻ image ở hai file phải giống nhau (test của xtask kiểm).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Chạy lại bằng tay trên một tag `vX.Y.Z` (Actions → Run workflow → chọn tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Kiểm riêng của phát hành: tag khớp `version` trong Cargo.toml và CHANGELOG.md có mục của bản này.
  # Chạy trước, vài giây, để tag sai không tốn một lần gate.
  verify:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section [$version]" >&2; exit 1; }

  # Dùng lại kết quả CI của đúng commit (D-20261121-ci-batch-release-faster): nếu workflow CI trên `main` của
  # ĐÚNG SHA của tag đã `success` (gate SQLite + PostgreSQL 16 và 18, upgrade-test, quét secret — đúng thứ D-300
  # đòi trước khi phát hành) thì không chạy lại gate. Chưa có lần chạy, đang chạy hay đỏ thì `reuse=false`
  # và job `gate` bên dưới chạy như cũ. Chạy lại bằng tay (workflow_dispatch) cũng kiểm theo SHA của tag đã chọn.
  ci-result:
    needs: verify
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Lần chạy của ci.yml do push vào `main` trên đúng commit này; lấy lần mới nhất.
          result="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f event=push -f branch=main -f per_page=1 \
            --jq '.workflow_runs[0] | "\(.status // "none") \(.conclusion // "none") \(.html_url // "")"' || true)"
          echo "CI on main for $SHA: ${result:-none}"
          case "$result" in
            "completed success "*)
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "CI on main already passed the full gate for this commit: skipping the gate here." ;;
            *)
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "No green CI run on main for this commit: running the gate." ;;
          esac

  # Gate đầy đủ chia nhiều máy, dùng chung với ci.yml (build archive một lần rồi 8 shard; D-20261120-release-gate-sharded).
  # Chỉ chạy khi CI trên `main` chưa xanh cho đúng commit này. PostgreSQL 16 như trước: bản 18 đã chạy ở lần
  # push lên main của cùng commit.
  gate:
    needs: [verify, ci-result]
    if: ${{ !github.event.repository.private && needs.ci-result.outputs.reuse != 'true' }}
    uses: ./.github/workflows/gate.yml
    with:
      postgres-18: false

  # Mỗi kiến trúc build trên máy cùng kiến trúc, đẩy image theo digest (chưa có tag); job
  # `publish` ghép các digest thành một image đa nền tảng.
  image:
    needs: [verify, gate]
    # Gate bị bỏ qua (CI trên main đã xanh) thì vẫn build; gate đỏ hay bị huỷ thì không.
    if: ${{ !cancelled() && needs.verify.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.gate.result) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          # Máy build ARM của GitHub: miễn phí cho repo công khai (D-078 để sau vì giả lập quá lâu).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Tên image trên ghcr.io phải viết thường; tên chủ repo có thể có chữ hoa.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Chứng thực của BuildKit nằm cùng image: SBOM và nguồn gốc build đầy đủ.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Ký chứng thực (Sigstore qua OIDC) và lưu nó vào GitHub.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-platform image with its tags
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: index
        name: Digest of the multi-platform image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Chứng thực nguồn gốc build (SLSA), ký và lưu ở GitHub lẫn registry:
      # `gh attestation verify oci://ghcr.io/<owner>/autoxide:X.Y.Z --owner <owner>`.
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      # Danh sách thành phần (SPDX) của image, cũng ký thành chứng thực và đính vào bản phát hành.
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v section="## [$version]" '
            index($0, section) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # GitHub giới hạn ghi chú một bản phát hành ở 125 000 ký tự (v0.15.0 vượt). Dài hơn thì thay
          # bằng đoạn ngắn dẫn tới mục của bản này trong CHANGELOG.md của tag.
          if [ "$(wc -c < notes.md)" -gt 120000 ]; then
            anchor="$(printf '%s' "$version" | tr -d '.')"
            released="$(grep -m1 "^## \\[$version\\]" CHANGELOG.md | sed 's/.* - //')"
            {
              echo "Docker image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$version\` (linux/amd64, linux/arm64)."
              echo
              echo "The list of changes is too long for this page; see"
              echo "[CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md#${anchor}---${released})."
            } > notes.md
          fi
      # Gói SDK TypeScript đính kèm bản phát hành: client cài bằng URL của file, không cần npm registry (D-177).
      - name: Pack the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm pack
          mv autoxide-sdk-*.tgz ../../
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sdk="$(ls autoxide-sdk-*.tgz)"
          # Chủ dự án có thể đã tạo trang Release để có tag (agent không đẩy được tag): khi đó cập nhật
          # trang đó và đính kèm file, thay vì báo "already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Autoxide $TAG" --notes-file notes.md
            gh release upload "$TAG" --clobber \
              "sbom.spdx.json#SBOM (SPDX JSON) of the Docker image" \
              "$sdk#TypeScript SDK (npm install <URL of this file>)"
          else
            gh release create "$TAG" --title "Autoxide $TAG" --notes-file notes.md --verify-tag \
              "sbom.spdx.json#SBOM (SPDX JSON) of the Docker image" \
              "$sdk#TypeScript SDK (npm install <URL of this file>)"
          fi
