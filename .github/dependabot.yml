# Dependabot đề xuất nâng cấp bằng pull request; CI chạy trên PR như mọi PR khác. Gom theo nhóm để mỗi tuần một PR mỗi loại.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Chỉ test passkey dùng `p256`, và phải cùng bản với `webauthn_rp` (0.3 dùng 0.13).
      # Bỏ dòng này khi nâng `webauthn_rp` lên bản dùng `p256` 0.14 (D-092).
      - dependency-name: p256
        versions: [">= 0.14"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Image nền trong compose.yml (Postgres) cũng ghim theo digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  # Action của GitHub ghim theo SHA đầy đủ (kèm comment phiên bản): Dependabot nâng cả SHA và comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
