[package]
name = "autoxide-media"
description = "Autoxide media library: images, video, audio and documents in nested folders, with real-type checks, image sizes, public links, byte ranges, versioned URLs and a trash."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# `api::testing::FakeMedia` cho test của module khác. Chỉ bật ở `[dev-dependencies]`
# (D-20261122-module-test-fakes).
testing = []
# Bản AVIF của ảnh thu nhỏ (`AUTOXIDE_MEDIA_AVIF`, D-20261121-avif-feature). Không bật mặc định: bộ mã hoá
# `rav1e` kéo proc-macro `paste` đã ngừng bảo trì (RUSTSEC-2024-0436), nên bản build mặc định không có nó.
avif = ["dep:ravif"]
# Lệnh `media.bench_seed` sinh dữ liệu đo (bước 39 B1); bật qua feature `bench-seed` của `autoxide`.
bench-seed = []

[dependencies]
jiff.workspace = true
async-trait.workspace = true
autoxide-kernel.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
image.workspace = true
imagesize.workspace = true
webp.workspace = true
ravif = { workspace = true, optional = true }
metrics.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
validator.workspace = true

[dev-dependencies]
proptest.workspace = true
autoxide-testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
