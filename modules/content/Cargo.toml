[package]
name = "autoxide-content"
description = "Autoxide content: posts and nested pages with drafts, revisions, scheduling, translations, categories, tags, authors, menus, redirects, SEO data and public read endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Lệnh `content.bench_seed` sinh dữ liệu đo (bước 39 B1); bật qua feature `bench-seed` của `autoxide`.
bench-seed = []

[dependencies]
autoxide-spike-macros = { path = "../../spikes/macros" }
jiff.workspace = true
metrics.workspace = true
async-trait.workspace = true
autoxide-compliance.workspace = true
autoxide-kernel.workspace = true
autoxide-media.workspace = true
autoxide-organizations.workspace = true
axum.workspace = true
base64.workspace = true
hmac.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
validator.workspace = true

[dev-dependencies]
# Thư viện media giả dùng chung (`autoxide_media::api::testing`).
autoxide-media = { workspace = true, features = ["testing"] }
proptest.workspace = true
autoxide-testkit.workspace = true

[lints]
workspace = true
