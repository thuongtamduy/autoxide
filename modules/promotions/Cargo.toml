[package]
name = "autoxide-promotions"
description = "Autoxide promotions module: automatic discounts, coupons and vouchers, flash sales, stacking rules, usage holds and legal limits as dated data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
jiff.workspace = true
async-trait.workspace = true
autoxide-catalog.workspace = true
autoxide-compliance.workspace = true
autoxide-kernel.workspace = true
autoxide-notifications.workspace = true
autoxide-organizations.workspace = true
axum.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
validator.workspace = true

[dev-dependencies]
proptest.workspace = true
# Catalog giả dùng chung (`autoxide_catalog::api::testing`).
autoxide-catalog = { workspace = true, features = ["testing"] }
# Sổ đồng ý giả dùng chung (`autoxide_compliance::api::testing`).
autoxide-compliance = { workspace = true, features = ["testing"] }
# Bộ gửi thông báo giả dùng chung (`autoxide_notifications::api::testing`).
autoxide-notifications = { workspace = true, features = ["testing"] }
autoxide-testkit.workspace = true
# MCP client thật cho test tool của module.
tokio.workspace = true

# Bộ đo tính giỏ (D-222): `cargo bench -p autoxide-promotions`.
[[bench]]
name = "evaluate"
harness = false

[lints]
workspace = true
