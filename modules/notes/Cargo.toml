[package]
name = "autoxide-notes"
description = "Autoxide sample module: personal notes. A template that uses every part of the module contract; not registered in the binary by default."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
autoxide-kernel.workspace = true
axum.workspace = true
chrono.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true
validator.workspace = true

[dev-dependencies]
autoxide-testkit.workspace = true
# MCP client thật cho test tool của module.
rmcp = { workspace = true, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest-tls-no-provider",
] }
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true

# Bộ đo hiệu năng của core (D-071): `cargo bench -p autoxide-notes`.
[[bench]]
name = "core"
harness = false

[lints]
workspace = true
