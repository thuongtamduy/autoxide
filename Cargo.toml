# Workspace Autoxide. Mỗi crate con chỉ khai `<tên>.workspace = true`; phiên bản
# và feature flag của thư viện ghim ở MỘT chỗ là file này.
#
# Bố cục (luật ranh giới do `cargo xtask check` kiểm, xem docs/DECISIONS.md D-031):
#   crates/kernel   nền mà mọi module dựa vào; không phụ thuộc module nào
#   crates/testkit  đồ dùng cho test; chỉ được là dev-dependency
#   crates/app      binary `autoxide`: nơi duy nhất đăng ký module
#   modules/<tên>   mỗi module một crate
#   xtask           công cụ cho người phát triển, không nằm trong binary
[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "xtask"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# Luật code trong CLAUDE.md, do trình biên dịch và clippy thực thi.
# Mỗi crate phải có `[lints] workspace = true` (xtask kiểm).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Ngoài test thì trả lỗi, không làm sập tiến trình. Phần "ngoài test" cấu hình
# ở clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# --- Crate nội bộ ---
autoxide-kernel = { path = "crates/kernel" }
autoxide-testkit = { path = "crates/testkit" }
autoxide-audit = { path = "modules/audit" }
autoxide-auth = { path = "modules/auth" }
autoxide-idempotency = { path = "modules/idempotency" }
autoxide-mail = { path = "modules/mail" }
autoxide-ai = { path = "modules/ai" }
autoxide-files = { path = "modules/files" }
autoxide-notes = { path = "modules/notes" }
autoxide-webhooks = { path = "modules/webhooks" }
autoxide-media = { path = "modules/media" }
autoxide-content = { path = "modules/content" }
autoxide-forms = { path = "modules/forms" }
autoxide-newsletter = { path = "modules/newsletter" }
autoxide-comments = { path = "modules/comments" }
autoxide-menus = { path = "modules/menus" }
autoxide-reporting = { path = "modules/reporting" }
autoxide-automations = { path = "modules/automations" }
autoxide-address = { path = "modules/address" }
autoxide-organizations = { path = "modules/organizations" }
autoxide-plans = { path = "modules/plans" }
autoxide-tax = { path = "modules/tax" }
autoxide-ledger = { path = "modules/ledger" }
autoxide-invoices = { path = "modules/invoices" }
autoxide-compliance = { path = "modules/compliance" }
autoxide-notifications = { path = "modules/notifications" }
autoxide-analytics = { path = "modules/analytics" }
autoxide-catalog = { path = "modules/catalog" }
autoxide-inventory = { path = "modules/inventory" }
autoxide-shipping = { path = "modules/shipping" }
autoxide-support = { path = "modules/support" }
autoxide-bookings = { path = "modules/bookings" }
autoxide-conversations = { path = "modules/conversations" }
autoxide-promotions = { path = "modules/promotions" }
autoxide-orders = { path = "modules/orders" }
autoxide-customers = { path = "modules/customers" }

# --- Thư viện nền (STACK.md, bảng "Nền") ---
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = [
  "catch-panic",
  "compression-br",
  "compression-gzip",
  "cors",
  "limit",
  "request-id",
] }
# Khai rõ từng feature đang dựa vào thay vì nhận bộ mặc định. Không bật
# `with-rust_decimal` và `with-time`: tiền là số nguyên, thời gian dùng `autoxide_kernel::time`
# (CLAUDE.md, "Luật dữ liệu"). Migration do kernel tự chạy (D-20261121-own-migrations), không qua
# `sea-orm-migration` — thư viện đó bật lại bộ feature mặc định của sea-orm (kéo `chrono`, `time`,
# `rust_decimal`). TLS dùng rustls để binary không phụ thuộc OpenSSL của hệ điều hành.
sea-orm = { version = "2.0", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlite-use-returning-for-3_35",
  "sqlx-postgres",
  "sqlx-sqlite",
  "stream",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
# `jiff_0_2`: `utoipa` nhận kiểu theo TÊN lúc biên dịch (`Timestamp` → `date-time`, `Date` → `date`), không kéo crate
# `jiff` 0.2 nào — để kiểu của `autoxide_kernel::time` cho cùng OpenAPI như `chrono` (D-20261121-time-library).
utoipa = { version = "6.0", features = ["axum_extras", "chrono", "jiff_0_2", "uuid"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.21", features = ["derive"] }
uuid = { version = "1.29", features = ["serde", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# Số thập phân cho TÍNH tiền, thuế, tỉ giá (D-322); tiền LƯU vẫn là số nguyên `Money`.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
# Bộ dựng mẫu cho mẫu do khách tự soạn (mẫu in, mail, thông báo — D-351): cú pháp Jinja, hộp cát,
# giới hạn bước chạy (`fuel`). Bỏ feature mặc định: không `multi_template` (không include / extends /
# loader → không đọc file), không `macros`; `debug` chỉ để lỗi cú pháp có cột (hàm `debug()` bị gỡ).
minijinja = { version = "3.1.0", default-features = false, features = ["builtins", "debug", "serde", "fuel"] }
# Khung mail HTML của mẫu thông báo do khách soạn (D-206, D-366): MJML viết bằng Rust, chạy đúng trên
# Outlook, Gmail, điện thoại. Chỉ `parse` + `render`: không loader (không `mj-include` đọc file hay mạng),
# không `json` / `print`.
mrml = { version = "6.0.1", default-features = false, features = ["parse", "render"] }
# PDF của mẫu in chứng từ (D-353): thuần Rust, nhúng (tập con) font TrueType có dấu tiếng Việt. Không bật
# feature nào: không ảnh raster, không `simple-text` (kéo `rustybuzz` / `ttf-parser` đã ngừng bảo trì) —
# glyph dựng bằng `skrifa`.
krilla = { version = "0.8.2", default-features = false }
# Tra glyph và đo bề rộng chữ cho PDF (cùng phiên bản krilla đã kéo vào).
skrifa = "0.50"
# File Excel (.xlsx) của bản xuất kế toán (D-354). Không bật feature nào (không serde, không polars).
rust_xlsxwriter = { version = "0.102.0", default-features = false }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
# Thời gian thay `chrono` / `chrono-tz` (đã ngừng bảo trì; D-20261121-time-library): lớp `autoxide_kernel::time`
# dựng trên `jiff`. Bỏ `tz-system` / `tzdb-zoneinfo` (đọc `/usr/share/zoneinfo` của máy): cơ sở dữ liệu múi giờ
# luôn nhúng vào binary (`tzdb-bundle-always`) như `chrono-tz`, để mọi máy (kể cả image không có zoneinfo) tính
# giờ địa phương giống nhau.
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always", "perf-inline"] }
clap = { version = "4.6", features = ["derive", "env"] }
# Trait có hàm `async` dùng được qua `dyn` (hợp đồng giữa các module). Rust chưa
# hỗ trợ trực tiếp; SeaORM vốn đã kéo thư viện này vào cây phụ thuộc.
async-trait = "0.1"
# Luồng byte (tải file lên / xuống mà không giữ cả file trong bộ nhớ). Đều đã có sẵn
# trong cây phụ thuộc (qua axum, hyper): khai ra để dùng thẳng.
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
# Tạo ảnh thu nhỏ trong module `media` (D-093): giải mã JPEG / PNG / GIF / WebP, đổi cỡ,
# mã hoá JPEG / PNG. Thuần Rust, chỉ bật đúng các định dạng cần, không `rayon`.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Mã hoá WebP có mất dữ liệu (kèm alpha) cho ảnh thu nhỏ của `media` (D-176, D-196): `image`
# chỉ mã hoá WebP không mất dữ liệu. Bọc `libwebp` (C, BSD-3-Clause, biên dịch kèm như SQLite).
webp = { version = "0.3", default-features = false }
# Mã hoá AVIF cho ảnh thu nhỏ của `media` (bước 39 B8, D-20261119-step39-avif): job nền, tắt mặc định.
# Rust thuần (`rav1e`, BSD-2-Clause): không bật `asm` (cần `nasm` lúc build) hay `threading` (`rayon`).
ravif = { version = "0.13", default-features = false }
# Slug của module `content` (D-102): chuyển chữ Unicode sang ASCII ("Đà Lạt" → "da-lat").
slug = "0.1"
# Bỏ dấu khi tìm theo chữ ("da lat" ra "Đà Lạt"): tách chữ và dấu (NFD) rồi bỏ dấu
# (`search::fold` của kernel). Đã có sẵn trong cây phụ thuộc (qua `webauthn_rp`).
unicode-normalization = "0.1"
# Chiều rộng / cao của ảnh (JPEG, PNG, GIF, WebP, AVIF) từ header, không giải mã ảnh
# (module `media`, D-089). Chỉ bật đúng các định dạng cần.
imagesize = { version = "0.15", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "heif",
] }
# S3 / dịch vụ tương thích S3 của module `files` (D-20261121-s3-client): chỉ dựng và ký request (AWS SigV4),
# gửi bằng `reqwest` sẵn có. `rustcrypto`: ký bằng `hmac` / `sha2` đã có (không kéo aws-lc-rs); `full`: đọc
# XML trả về (danh sách, multipart) và credential của IAM role (IMDS).
rusty-s3 = { version = "0.12", default-features = false, features = ["rustcrypto", "full"] }
# Địa chỉ cho `rusty-s3` (đã có trong cây phụ thuộc qua `reqwest`).
url = "2"
# HTTP client (S3 của `files`, OIDC, AI…). rustls không kèm provider: dùng provider `ring` sẵn có trong
# chương trình (feature `rustls` của reqwest kéo aws-lc-rs). `stream`: đọc thân response thành luồng (tải
# file lớn từ S3 không giữ cả file trong bộ nhớ).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# Để kernel cài provider `ring` cho rustls (reqwest không tự chọn khi không kèm provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# MCP endpoint (SDK chính thức của Model Context Protocol): server Streamable HTTP ở
# kernel. Bỏ feature mặc định (macro tool — tool khai bằng hợp đồng module, không bằng
# macro). Client (`client`, `transport-streamable-http-client-reqwest`,
# `reqwest-tls-no-provider`) chỉ bật trong [dev-dependencies] cho test.
rmcp = { version = "3.9", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
# Gửi mail qua SMTP. Bỏ bộ feature mặc định (native-tls kéo OpenSSL); TLS dùng rustls với
# `ring` — cùng thư viện mật mã sqlx đang dùng, tránh xung đột ở D-043.
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
# Đọc file `.env` (chỉ đọc thành cặp tên/giá trị, không sửa môi trường tiến trình).
dotenvy = "0.15"
# Tra bản ghi TXT khi xác minh tên miền riêng của khách (bước 33, D-190). Chỉ bật `tokio` (chạy trên
# runtime sẵn có) và `system-config` (đọc `/etc/resolv.conf` / cấu hình DNS của hệ điều hành); không
# bật DNS-over-TLS / HTTPS / QUIC hay DNSSEC (kéo thêm rustls provider và quinn).
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

# --- Bảo mật (STACK.md, bảng "Bảo mật") ---
# Bộ feature mặc định: `alloc`, `getrandom` (salt ngẫu nhiên), `password-hash` (chuỗi PHC).
argon2 = "0.6"
# Access token: JWT HS256 tự viết theo RFC 7519 bằng các khối RustCrypto dưới đây (D-045).
# Cả bốn đã có sẵn trong cây phụ thuộc (qua sqlx, uuid, argon2).
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# Mã hoá secret khi lưu (AES-256-GCM, bước 33, D-257). Cả hai đã có trong cây phụ thuộc (`ring` qua
# rustls, `zeroize` qua RustCrypto): không thêm crate nào để biên dịch.
ring = "0.17"
zeroize = "1"
# TOTP (RFC 6238). Chỉ bật `std` và `otpauth` (đường dẫn `otpauth://` cho ứng dụng
# authenticator); không bật `qr` (kéo thư viện ảnh) và `gen_secret` (secret tự sinh
# bằng `getrandom` như mọi chỗ khác).
# Passkey (WebAuthn, phía máy chủ): thuần Rust trên RustCrypto, không OpenSSL (D-077).
webauthn_rp = { version = "0.3", default-features = false, features = [
  "serde_relaxed",
  "serializable_server_state",
] }
# Chỉ cho test: authenticator phần mềm ký câu trả lời passkey bằng P-256.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
totp-rs = { version = "6.0", default-features = false, features = ["std", "otpauth"] }

# --- Observability (STACK.md, bảng "Observability") ---
tracing = "0.1"
# Không bật `ansi` (màu) và `tracing-log`: log đi vào file hoặc máy thu gom.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }

metrics = "0.24"
# Không bật máy chủ HTTP riêng và push gateway của thư viện: `/metrics` do máy chủ
# của Autoxide phục vụ.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Tracing phân tán, xuất theo OTLP qua HTTP. Chỉ bật phần trace; TLS dùng rustls.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
] }
tracing-opentelemetry = { version = "0.34", default-features = false }

# Markdown giới hạn của bình luận (D-252): chỉ bộ phân tích (pull parser); HTML do `comments` tự
# dựng theo danh sách thẻ cho phép, nên tắt feature `html` và `getopts` (công cụ dòng lệnh).
pulldown-cmark = { version = "0.13", default-features = false }

# --- Chỉ dùng trong test ---
# `ServiceExt::oneshot`: gửi một request thẳng vào router, không cần mở port — trong test, và ở lô
# ghi đồng bộ của kernel (bước 69 P2: chạy từng lệnh qua router con).
tower = { version = "0.5", features = ["util"] }
# Client WebSocket cho test của `GET /api/v1/kernel/events/ws` (cùng bản axum dùng, bước 69 P3).
tokio-tungstenite = "0.29"
# Property test cho bộ kiểm đầu vào (đặc tả 31 B3): sinh đầu vào ngẫu nhiên, thu gọn ca hỏng.
# Bỏ `fork` / `timeout` (chạy mỗi ca trong tiến trình con): không cần.
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Bản build để dev và test chỉ giữ thông tin dòng code (đủ để backtrace và panic chỉ đúng file,
# dòng), bỏ thông tin biến cho debugger: `target/` nhỏ đi và biên dịch, link nhanh hơn (D-172).
# `test` kế thừa `dev` nên không cần khai riêng. Cần debugger xem biến thì tạm đổi thành
# `debug = true` trên máy mình, không commit.
[profile.dev]
debug = "line-tables-only"

# Thư viện ngoài (`"*"` không gồm crate của workspace) được tối ưu nhẹ trong bản dev và test: test chạy
# nhanh gần gấp đôi, còn sửa code của mình thì build lại nhanh như cũ vì crate của workspace vẫn không tối ưu.
# Hàm băm mật khẩu cố tình chậm nên tối ưu hết cỡ. Số đo ở D-299.
[profile.dev.package."*"]
opt-level = 1
# Không giữ thông tin debug của thư viện ngoài: mỗi chương trình test link toàn bộ thư viện, nên phần
# này nhân lên theo số chương trình và chiếm phần lớn `target/`. Stack trace trong code của mình vẫn có
# số dòng; trong thư viện ngoài chỉ còn tên hàm (D-20261118-build-size).
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Bản release vẫn kiểm tràn số nguyên (D-179): mặc định của Rust chỉ kiểm ở bản dev, bản release
# cộng tràn `i64` sẽ âm thầm quay vòng (số dư dương lớn thành âm). Kiểm tràn biến lỗi đó thành
# panic có log thay vì dữ liệu sai; tiền đi qua `Money` còn trả lỗi trước cả khi tràn. Số đo
# trước / sau ở D-179.
[profile.release]
overflow-checks = true
# Cỡ và tốc độ bản release (D-20261120-release-profile), đo trên cùng máy, build sạch: gốc 377 MB / 25.9
# phút; chỉ strip 290 MB; strip + LTO thin + 1 codegen unit 198 MB / 21.2 phút, đường nóng nhanh hơn 1–21%;
# LTO fat 181 MB nhưng 40.3 phút và không nhanh hơn thin. Bỏ bảng symbol: thông báo panic vẫn có file và
# dòng, chỉ backtrace (`RUST_BACKTRACE`) mất tên hàm.
strip = "symbols"
lto = "thin"
codegen-units = 1
