# Workspace Autoxide. Mỗi crate con chỉ khai `<tên>.workspace = true`; phiên bản
# và feature flag của thư viện ghim ở MỘT chỗ là file này.
#
# Bố cục (luật ranh giới do `cargo xtask check` kiểm, xem docs/DECISIONS.md D-031):
#   crates/kernel   nền mà mọi module dựa vào; không phụ thuộc module nào
#   crates/testkit  đồ dùng cho test; chỉ được là dev-dependency
#   crates/app      binary `autoxide`: nơi duy nhất đăng ký module
#   modules/<tên>   mỗi module một crate
#   xtask           công cụ cho người phát triển, không nằm trong binary
[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# Luật code trong CLAUDE.md, do trình biên dịch và clippy thực thi.
# Mỗi crate phải có `[lints] workspace = true` (xtask kiểm).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Ngoài test thì trả lỗi, không làm sập tiến trình. Phần "ngoài test" cấu hình
# ở clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# --- Crate nội bộ ---
autoxide-kernel = { path = "crates/kernel" }
autoxide-testkit = { path = "crates/testkit" }
autoxide-audit = { path = "modules/audit" }
autoxide-auth = { path = "modules/auth" }
autoxide-idempotency = { path = "modules/idempotency" }
autoxide-mail = { path = "modules/mail" }
autoxide-ai = { path = "modules/ai" }
autoxide-files = { path = "modules/files" }
autoxide-notes = { path = "modules/notes" }
autoxide-webhooks = { path = "modules/webhooks" }
autoxide-media = { path = "modules/media" }
autoxide-content = { path = "modules/content" }
autoxide-forms = { path = "modules/forms" }
autoxide-newsletter = { path = "modules/newsletter" }
autoxide-comments = { path = "modules/comments" }

# --- Thư viện nền (STACK.md, bảng "Nền") ---
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["catch-panic", "cors", "limit", "request-id"] }
# Khai rõ từng feature đang dựa vào thay vì nhận bộ mặc định. Không bật
# `with-rust_decimal` và `with-time`: tiền là số nguyên, thời gian dùng chrono
# (CLAUDE.md, "Luật dữ liệu") — hai thư viện đó vẫn có trong cây phụ thuộc vì
# sea-orm-migration bật lại bộ mặc định của sea-orm, nhưng code Autoxide không
# dùng. TLS dùng rustls để binary không phụ thuộc OpenSSL của hệ điều hành.
sea-orm = { version = "2.0", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlite-use-returning-for-3_35",
  "sqlx-postgres",
  "sqlx-sqlite",
  "stream",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
# Bỏ feature mặc định `cli`: lệnh migrate nằm trong CLI của Autoxide.
sea-orm-migration = { version = "2.0", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
utoipa = { version = "6.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.21", features = ["derive"] }
uuid = { version = "1.29", features = ["serde", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
# Trait có hàm `async` dùng được qua `dyn` (hợp đồng giữa các module). Rust chưa
# hỗ trợ trực tiếp; SeaORM vốn đã kéo thư viện này vào cây phụ thuộc.
async-trait = "0.1"
# Luồng byte (tải file lên / xuống mà không giữ cả file trong bộ nhớ). Đều đã có sẵn
# trong cây phụ thuộc (qua axum, hyper): khai ra để dùng thẳng.
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
# Tạo ảnh thu nhỏ trong module `media` (D-093): giải mã JPEG / PNG / GIF / WebP, đổi cỡ,
# mã hoá JPEG / PNG. Thuần Rust, chỉ bật đúng các định dạng cần, không `rayon`.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Slug của module `content` (D-102): chuyển chữ Unicode sang ASCII ("Đà Lạt" → "da-lat").
slug = "0.1"
# Bỏ dấu khi tìm theo chữ ("da lat" ra "Đà Lạt"): tách chữ và dấu (NFD) rồi bỏ dấu
# (`search::fold` của kernel). Đã có sẵn trong cây phụ thuộc (qua `webauthn_rp`).
unicode-normalization = "0.1"
# Chiều rộng / cao của ảnh (JPEG, PNG, GIF, WebP, AVIF) từ header, không giải mã ảnh
# (module `media`, D-089). Chỉ bật đúng các định dạng cần.
imagesize = { version = "0.15", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "heif",
] }
# Lưu file: một trait chung cho ổ đĩa cục bộ và S3 / dịch vụ tương thích S3. S3 dùng
# `aws-base` + `ring` thay vì feature `aws` (kéo aws-lc-rs): một thư viện mật mã duy
# nhất cho cả chương trình (D-043).
object_store = { version = "0.14", default-features = false, features = [
  "fs",
  "aws-base",
  "reqwest",
  "ring",
] }
# Chỉ để chọn TLS cho HTTP client của `object_store`: rustls không kèm provider, dùng
# provider `ring` sẵn có trong chương trình (feature `rustls` của reqwest kéo aws-lc-rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Để kernel cài provider `ring` cho rustls (reqwest không tự chọn khi không kèm provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# MCP endpoint (SDK chính thức của Model Context Protocol): server Streamable HTTP ở
# kernel. Bỏ feature mặc định (macro tool — tool khai bằng hợp đồng module, không bằng
# macro). Client (`client`, `transport-streamable-http-client-reqwest`,
# `reqwest-tls-no-provider`) chỉ bật trong [dev-dependencies] cho test.
rmcp = { version = "3.9", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
# Gửi mail qua SMTP. Bỏ bộ feature mặc định (native-tls kéo OpenSSL); TLS dùng rustls với
# `ring` — cùng thư viện mật mã sqlx đang dùng, tránh xung đột ở D-043.
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
# Đọc file `.env` (chỉ đọc thành cặp tên/giá trị, không sửa môi trường tiến trình).
dotenvy = "0.15"

# --- Bảo mật (STACK.md, bảng "Bảo mật") ---
# Bộ feature mặc định: `alloc`, `getrandom` (salt ngẫu nhiên), `password-hash` (chuỗi PHC).
argon2 = "0.6"
# Access token: JWT HS256 tự viết theo RFC 7519 bằng các khối RustCrypto dưới đây (D-045).
# Cả bốn đã có sẵn trong cây phụ thuộc (qua sqlx, uuid, argon2).
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# TOTP (RFC 6238). Chỉ bật `std` và `otpauth` (đường dẫn `otpauth://` cho ứng dụng
# authenticator); không bật `qr` (kéo thư viện ảnh) và `gen_secret` (secret tự sinh
# bằng `getrandom` như mọi chỗ khác).
# Passkey (WebAuthn, phía máy chủ): thuần Rust trên RustCrypto, không OpenSSL (D-077).
webauthn_rp = { version = "0.3", default-features = false, features = [
  "serde_relaxed",
  "serializable_server_state",
] }
# Chỉ cho test: authenticator phần mềm ký câu trả lời passkey bằng P-256.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
totp-rs = { version = "6.0", default-features = false, features = ["std", "otpauth"] }

# --- Observability (STACK.md, bảng "Observability") ---
tracing = "0.1"
# Không bật `ansi` (màu) và `tracing-log`: log đi vào file hoặc máy thu gom.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }

metrics = "0.24"
# Không bật máy chủ HTTP riêng và push gateway của thư viện: `/metrics` do máy chủ
# của Autoxide phục vụ.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Tracing phân tán, xuất theo OTLP qua HTTP. Chỉ bật phần trace; TLS dùng rustls.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
] }
tracing-opentelemetry = { version = "0.34", default-features = false }

# --- Chỉ dùng trong test ---
# `ServiceExt::oneshot`: gửi một request thẳng vào router, không cần mở port.
tower = { version = "0.5", features = ["util"] }
