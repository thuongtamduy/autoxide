# cargo-deny: kiểm license, lỗ hổng đã công bố và nguồn của mọi thư viện.
# Chạy tay: cargo deny check        (./gate.sh chạy lệnh này)

[graph]
# Chỉ xét các nền tảng Autoxide hỗ trợ; bỏ qua thư viện chỉ dùng cho nền tảng khác.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# Tính cả thư viện bỏ hoang ở phụ thuộc gián tiếp. cargo-deny 0.22 mặc định chỉ tính phụ thuộc
# trực tiếp; ghim để máy và CI (khác phiên bản) cho cùng kết quả với `-D advisory-not-detected`.
unmaintained = "all"
# Mặc định: lỗ hổng và thư viện bị bỏ hoang đều là lỗi. Ngoại lệ phải ghi lý do
# ở đây VÀ ở docs/DECISIONS.md. Gate chạy với `-D advisory-not-detected`: ngoại
# lệ không còn cần nữa thì gate đỏ cho tới khi gỡ dòng đó đi.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa: timing side channel when using a PRIVATE key. Only reached through webauthn_rp, which verifies passkey signatures with PUBLIC keys; no secret is ever processed. See docs/DECISIONS.md D-077." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint < 0.7.6: timing side channels on SECRET integers. Only reached through webauthn_rp (p256/p384 0.13) for public-key signature verification; no secret is ever processed. See docs/DECISIONS.md D-077." },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (no vulnerability). sqlx and sea-orm (the database layer) are built on it, so it cannot be replaced alone; move to jiff/time when they do. See docs/DECISIONS.md D-346." },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained (no vulnerability), only used to read IANA time zone names; replaced together with chrono. See docs/DECISIONS.md D-346." },
]

[licenses]
# Autoxide phát hành theo MIT OR Apache-2.0 (D-021). Chỉ nhận thư viện có license
# cho phép dùng trong sản phẩm như vậy; license copyleft (GPL, AGPL, LGPL) bị từ
# chối vì không nằm trong danh sách.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # Bảng dữ liệu Unicode (các crate icu_*, dùng khi xử lý URL).
  "Unicode-3.0",
  # Danh sách chứng chỉ gốc của Mozilla (webpki-roots, dùng bởi rustls).
  "CDLA-Permissive-2.0",
  # BSD Zero Clause: thoáng hơn MIT, không bắt ghi tên tác giả (quoted_printable,
  # bộ mã hoá nội dung mail của lettre). D-061.
  "0BSD",
  # BSD 2-Clause: như BSD-3-Clause, bỏ điều khoản cấm dùng tên tác giả (arrayref, qua tiny-skia-path của
  # krilla — PDF mẫu in chứng từ). D-353.
  "BSD-2-Clause",
]
confidence-threshold = 0.9

[bans]
# Hai phiên bản của cùng một thư viện làm binary phình ra nhưng không sai; với
# các thư viện nền (axum, sqlx, http, tower) thì `cargo tree -d` là chỗ kiểm.
multiple-versions = "allow"
# `*` làm bản build không lặp lại được.
wildcards = "deny"
# Crate nội bộ phụ thuộc nhau bằng `path`, không có phiên bản — được phép.
allow-wildcard-paths = true

[sources]
# Chỉ lấy thư viện từ crates.io: không git, không registry lạ.
unknown-registry = "deny"
unknown-git = "deny"
