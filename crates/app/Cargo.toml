[package]
name = "autoxide"
description = "The Autoxide server binary and command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lệnh `autoxide task <module>.bench_seed` sinh dữ liệu đo cỡ thật (bước 39 B1, `scripts/bench-seed.sh`).
# Bản phát hành không bật: dữ liệu giả không bao giờ được ghi vào database thật.
bench-seed = [
  "autoxide-auth/bench-seed",
  "autoxide-media/bench-seed",
  "autoxide-content/bench-seed",
  "autoxide-comments/bench-seed",
]
# Bản AVIF của ảnh thu nhỏ (`AUTOXIDE_MEDIA_AVIF`): `cargo build --release --features avif`. Không bật mặc định
# (D-20261121-avif-feature): bộ mã hoá `rav1e` kéo proc-macro `paste` đã ngừng bảo trì.
avif = ["autoxide-media/avif"]

[dependencies]
jiff.workspace = true
autoxide-audit.workspace = true
autoxide-auth.workspace = true
autoxide-idempotency.workspace = true
autoxide-mail.workspace = true
autoxide-ai.workspace = true
autoxide-files.workspace = true
autoxide-kernel.workspace = true
autoxide-webhooks.workspace = true
autoxide-media.workspace = true
autoxide-content.workspace = true
autoxide-forms.workspace = true
autoxide-newsletter.workspace = true
autoxide-comments.workspace = true
autoxide-menus.workspace = true
autoxide-address.workspace = true
autoxide-organizations.workspace = true
autoxide-plans.workspace = true
autoxide-tax.workspace = true
autoxide-ledger.workspace = true
autoxide-invoices.workspace = true
autoxide-analytics.workspace = true
autoxide-compliance.workspace = true
autoxide-notifications.workspace = true
autoxide-catalog.workspace = true
autoxide-inventory.workspace = true
autoxide-shipping.workspace = true
autoxide-promotions.workspace = true
autoxide-orders.workspace = true
autoxide-customers.workspace = true
autoxide-support.workspace = true
autoxide-bookings.workspace = true
autoxide-conversations.workspace = true
autoxide-reporting.workspace = true
autoxide-automations.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
autoxide-testkit.workspace = true
# Module mẫu, không đăng ký trong binary: test migration chạy cả migration của nó.
autoxide-notes.workspace = true
# MCP client thật cho test đầu-cuối của endpoint MCP.
rmcp = { workspace = true, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest-tls-no-provider",
] }
# Client HTTP thật cho test nâng cấp (gọi máy chủ chạy trong container).
reqwest.workspace = true
rust_decimal.workspace = true
sea-orm.workspace = true
sha2.workspace = true
tower.workspace = true

[lints]
workspace = true
