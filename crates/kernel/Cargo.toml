[package]
name = "autoxide-kernel"
description = "Foundation every Autoxide module builds on: configuration, database access, errors, HTTP and the module contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
autoxide-macros.workspace = true
axum.workspace = true
matchit.workspace = true
base64.workspace = true
bytes.workspace = true
jiff.workspace = true
rust_decimal.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hickory-resolver.workspace = true
hmac.workspace = true
ring.workspace = true
http-body-util.workspace = true
metrics.workspace = true
reqwest.workspace = true
minijinja.workspace = true
opentelemetry.workspace = true
rustls.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slug.workspace = true
unicode-normalization.workspace = true
tokio.workspace = true
tower.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true
url.workspace = true
uuid.workspace = true
validator.workspace = true
zeroize.workspace = true

[features]
# For tests only: turned on by `autoxide-testkit` to build routes WITHOUT the layer that enforces `x-permissions`, so an
# audit can compare the documented permissions with what the services accept. Never turn it on in an application.
permission-audit = []
# For tests only: turned on by `autoxide-testkit` so tests can read and write any table directly
# (`db::all_tenants_for_tests`). Never turn it on in an application.
testing = []

[dev-dependencies]
proptest.workspace = true
# Benchmark vi mô của đường nóng (benches/hot_paths.rs, chạy hằng tuần ở load.yml); không vào binary.
divan.workspace = true
# tests/stack.rs xác nhận các thư viện nền hợp nhau trên cả hai database. Thư viện
# nào kernel bắt đầu dùng thì chuyển lên [dependencies].
# Chỉ `path`, không `version` (nên không dùng dòng của workspace): testkit phụ thuộc kernel, và crates.io
# không nhận vòng phụ thuộc — cargo bỏ dev-dependency không có phiên bản khi đóng gói.
autoxide-testkit = { path = "../testkit" }
tokio-tungstenite.workspace = true
# Test đọc lại số đo bằng bộ thu cục bộ và bắt log request bằng bộ ghi JSON; bộ thu và bộ ghi thật của tiến trình
# nằm ở `autoxide-host` (D-20261128-host-crate).
metrics-exporter-prometheus.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
