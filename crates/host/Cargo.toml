[package]
name = "autoxide-host"
description = "Process plumbing of the Autoxide binary (logging, metrics exporter, trace export). Internal: not part of the module contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Phần chỉ binary `autoxide` dùng, tách khỏi kernel (D-20261126-kernel-crates, D-20261128-host-crate): module không
# khai crate này (`cargo xtask check`, luật `dependency`), nên thư viện nặng chỉ binary cần (bộ xuất OTLP, bộ thu
# Prometheus, bộ ghi log) không còn nằm trong cây biên dịch của module.
[dependencies]
autoxide-kernel.workspace = true
axum.workspace = true
metrics-exporter-prometheus.workspace = true
